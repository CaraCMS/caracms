  AUTHORITATIVE for the screen's layout and hierarchy, the drop markers (beside vs inside), the group row with Rename…,

  (address list, the count line with its disclosure, the "goes: no pages left" line, the tick, the "changed underneath" state).

/* ══ Base (editor.css) ══ */

.input{display:block;width:100%;min-height:var(--control-h);padding:6px 10px;border:1px solid var(--border-strong);border-radius:var(--radius-md);background:var(--surface);font-size:var(--text-base);line-height:1.4;transition:border-color var(--dur-fast),box-shadow var(--dur-fast)}

.drow:active:not(:disabled),.menu button:active:not(:disabled),.tb>button:active:not(:disabled),.cal-g button:active:not([aria-pressed="true"]),
.twisty:active,.add-row:active:not(:disabled),.rchip:active,.item-sum:active,.lv:active,.mini-seg button:active:not([aria-checked="true"]),
.linkbtn.subtle:active,.ptype:active,.srow:active,.frow:active{background:var(--surface-pressed)}
.add-row:active:not(:disabled){color:var(--select-strong)}
/* ── On-states wear the brand too (Decision 12): a switch's track when on (M2: --text). The track and its knob take a
   1px ring in --accent-edge, so a pale accent (which brand.ts darkens) still edges at 3:1 on the cream; on a dark accent
   the ring is the fill itself and doesn't show. Off stays --border-strong. ── */

.item.is-open{box-shadow:var(--shadow-edge)}

/* ══════════════════════════════════════════════════════════════════════════

   ══════════════════════════════════════════════════════════════════════════ */

.arow.is-held:hover{background:none}
/* Marks for what's changed here and not applied yet: the tool's blue in a chip, and the new address in blue */
.arow.is-gone .an .nm,.arow.is-gone .an>.i{color:var(--text-subtle)}
.arow.is-gone .aa{color:var(--text-subtle);font-family:var(--font-ui)}
/* A new group with nothing in it: a full dashed ring (an empty slot, like .empty and .add-row), and its line under it */
.arow.is-empty{border:1px dashed var(--border-strong)}
.arow-sub{display:flex;align-items:center;flex-wrap:wrap;gap:var(--space-1-5) var(--space-2);min-height:24px;margin:0 0 var(--space-1);padding-left:calc(var(--arr-grip-w) + var(--depth,0) * var(--tree-indent) + 24px);font-size:var(--text-sm);color:var(--text-muted)}
.arow-sub.err{color:var(--status-danger);font-weight:var(--weight-medium)}
.arow-sub .i{flex:none}
/* Naming a new group, or renaming one, in its row */
.arow.is-naming{background:var(--surface-sunken);border-color:var(--border)}
.arow.is-naming:hover{background:var(--surface-sunken)}
.arow.is-naming .an .input{width:min(260px,100%);min-height:26px;height:26px;padding:2px 8px;font-size:var(--text-base)}
.arow.is-naming .ae .btn{flex:none}
/* Linked from the review: hovering an entry there washes its row here */
.arow.is-linked{background:var(--select-wash)}
/* Dragging. The row being dragged keeps its place as a dashed outline (the block list's ghost, .brow.is-ghost); what's under it goes with it. */
.arow.is-src{background:none;border:1px dashed var(--border-strong)}
.arow.is-src>*{visibility:hidden}
/* Inside: the row it goes into gets the selection's wash and a full 2px ring, and says so at its end */
.arow.is-into,.arow.is-into:hover{background:var(--select-wash);border-color:var(--select);box-shadow:0 0 0 1px var(--select)}
.arow.is-into .an .nm{color:var(--select-strong);font-weight:var(--weight-semibold)}
.arow.is-into .an>.i{color:var(--select-strong)}
.tag{display:inline-flex;align-items:center;gap:var(--space-1);height:20px;padding:0 var(--space-2);border-radius:var(--radius-pill);background:var(--select);color:var(--on-fill);font-size:var(--text-xs);font-weight:var(--weight-semibold);white-space:nowrap}
/* Refused: a danger wash and a full thin ring, and the reason in one line across the address and the end */
.arow.is-refused,.arow.is-refused:hover{background:var(--status-danger-wash);border-color:var(--status-danger-border)}
.arow-why{grid-column:3 / 5;display:flex;align-items:center;gap:var(--space-1-5);min-width:0;padding-right:var(--space-2);font-size:var(--text-sm);font-weight:var(--weight-medium);color:var(--status-danger);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* Beside: a 2px line between two rows, starting where that level's icons start (so its indent says which level), a ring at its
   start, and the level it lands in at its end. The line is a marker across the row, never a bar down a card's side. */
.amark{position:absolute;right:0;z-index:4;height:var(--arr-mark);border-radius:2px;background:var(--select);box-shadow:0 0 0 2px var(--surface);pointer-events:none}
.amark::before{content:"";position:absolute;left:-4px;top:50%;width:8px;height:8px;translate:0 -50%;border:2px solid var(--select);border-radius:50%;background:var(--surface)}
.amark .tag{position:absolute;right:var(--space-1);top:50%;translate:0 -50%;box-shadow:0 0 0 2px var(--surface)}
/* The card under the pointer while dragging */
.adrag{position:fixed;left:0;top:0;z-index:70;display:grid;grid-template-columns:16px minmax(0,1fr);align-items:center;gap:2px var(--space-2);min-width:220px;max-width:var(--arr-ghost-w);padding:var(--space-2) var(--space-3) var(--space-2) var(--space-2-5);background:var(--surface);border:1px solid var(--border-strong);border-radius:var(--radius-md);box-shadow:var(--shadow-drag);pointer-events:none;font-size:var(--text-base)}
.adrag>.i{color:var(--icon)}
.adrag .nm{display:flex;align-items:baseline;gap:var(--space-1-5);min-width:0;font-weight:var(--weight-semibold);white-space:nowrap;overflow:hidden}
.adrag .nm small{font-size:var(--text-xs);font-weight:var(--weight-regular);color:var(--text-subtle);overflow:hidden;text-overflow:ellipsis}
.adrag .to{grid-column:2;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font:var(--text-xs)/1.35 var(--font-mono);color:var(--select-strong)}
.adrag .to.plain{font-family:var(--font-ui);color:var(--text-muted)}
.adrag.no{border-color:var(--status-danger-border)}
.adrag.no .to{display:flex;align-items:center;gap:var(--space-1);font-family:var(--font-ui);font-weight:var(--weight-medium);color:var(--status-danger)}
body.is-dragging,body.is-dragging *{cursor:grabbing!important;user-select:none}
body.is-dragging.is-no,body.is-dragging.is-no *{cursor:not-allowed!important}

/* The pane's levels: Arrange pages, then Review */
.arr-none{font-size:var(--text-sm);color:var(--text-muted)}
.chg{list-style:none;margin:0 calc(-1 * var(--space-1));padding:0;display:flex;flex-direction:column;gap:1px}
.chg li{display:grid;grid-template-columns:16px minmax(0,1fr);gap:var(--space-2);padding:var(--space-1-5) var(--space-1);border-radius:var(--radius-md);font-size:var(--text-sm);color:var(--text-muted);line-height:1.4}
.chg li .i{margin-top:1px;color:var(--icon)}
.chg li b{color:var(--text);font-weight:var(--weight-semibold)}
.chg li.is-muted b{color:var(--text-muted)}
.arr-foot{flex:none;padding:var(--space-3) var(--space-4) var(--space-4);border-top:1px solid var(--border);background:var(--surface)}
.arr-foot .why{display:grid;grid-template-columns:16px minmax(0,1fr);gap:var(--space-1-5);margin-bottom:var(--space-3);font-size:var(--text-sm);color:var(--text-muted)}
.arr-foot .why .i{margin-top:1px;color:var(--icon)}
.arr-foot .why b{color:var(--text);font-weight:var(--weight-semibold)}
.arr-foot .busy{margin-bottom:var(--space-3);font-size:var(--text-sm);color:var(--status-waiting)}

/* The review: what moves, where, and whether old links keep working */
.rv-lead{margin-bottom:var(--space-4);font-size:var(--text-md);font-weight:var(--weight-semibold);line-height:1.35}
.rv-lead small{display:block;margin-top:2px;font-size:var(--text-sm);font-weight:var(--weight-regular);color:var(--text-muted)}
.rv{list-style:none;margin:0 calc(-1 * var(--space-1));padding:0;display:flex;flex-direction:column;gap:1px}
.rv-e{display:grid;grid-template-columns:16px minmax(0,1fr);column-gap:var(--space-2);row-gap:1px;margin-left:calc(var(--in,0) * var(--tree-indent));padding:var(--space-1-5) var(--space-1);border-radius:var(--radius-md);transition:background var(--dur-fast)}
.rv-e:hover{background:var(--surface-hover)}
.rv-e>.i{margin-top:1px;color:var(--icon)}
.rv-e .t{display:flex;align-items:center;flex-wrap:wrap;gap:var(--space-1) var(--space-1-5);min-width:0;font-weight:var(--weight-semibold);line-height:1.35}
.rv-e .t .chip{height:18px;font-size:var(--text-2xs)}
.rv-e.is-carried .t,.rv-e.is-held .t{font-weight:var(--weight-medium)}
.rv-e.is-gone .t{font-weight:var(--weight-medium);color:var(--text-muted)}
.rv-e.is-gone>.i{color:var(--text-subtle)}
.mv{grid-column:2;display:flex;flex-wrap:wrap;column-gap:var(--space-1);min-width:0;font:var(--text-xs)/1.5 var(--font-mono);color:var(--text-subtle);overflow-wrap:anywhere}
.mv .to{color:var(--text)}

.rv-docs{grid-column:2;list-style:none;margin:var(--space-1-5) 0 0;padding:var(--space-1-5) var(--space-2);border:1px solid var(--border);border-radius:var(--radius-md);background:var(--surface-sunken);font:var(--text-xs)/1.6 var(--font-mono);color:var(--text-muted);overflow-wrap:anywhere}
.rv-docs li.is-new{color:var(--status-warning-strong);font-weight:var(--weight-medium)}
.rv-tick{margin-top:var(--space-4);padding-top:var(--space-4);border-top:1px solid var(--border)}
.rv-tick .field-help{margin-bottom:0}

<script>
'use strict';
/* ══ Helpers ══ */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const ic = (n, c = '') => `<svg class="i${c ? ' ' + c : ''}" aria-hidden="true"><use href="#i-${n}"/></svg>`;
const PEOPLE = { niamh: 'Niamh', aoife: 'Aoife' };
const av = (p, c = '') => `<span class="av${c ? ' ' + c : ''}" style="--c:var(--p-${p})" title="${PEOPLE[p]}">${PEOPLE[p][0]}</span>`;
const plural = (k, one, many) => `${k} ${k === 1 ? one : many}`;
const andList = (a) => (a.length < 2 ? a.join('') : `${a.slice(0, -1).join(', ')} and ${a[a.length - 1]}`);
const clone = (x) => JSON.parse(JSON.stringify(x));
const HOST = 'localhost:4326';
/* New page's slug rules (slug.ts): what's typed becomes an address part */
const slugify = (s) => s.normalize('NFKD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/&/g, ' and ').replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
const NO_ADDRESS = 'That name has no letters or numbers to make an address from.';
const INDEX_MSG = '"index" is kept for Home, so it can’t be an address. Choose another name.';

/* ══ Sample content: the starter's pages, after collections-under-pages (Journal and Work hold their collections) ══ */
const POSTS = ['a-day-on-the-ferry', 'a-mark-for-the-bakery', 'a-new-home-for-caracms', 'a-new-intern', 'a-site-for-weekend-bikes', 'a-studio-open-day', 'a-summer-workshop', 'an-identity-for-tiny-publisher', 'back-at-the-ridge', 'choosing-a-text-face', 'letters-from-the-quay', 'notes-from-the-ridge', 'paper-samples-from-cork', 'posters-for-the-film-studio', 'proofing-by-hand', 'rebuilding-our-own-site', 'small-sites-that-stay-fast', 'the-autumn-print-run', 'the-first-week-at-the-mill', 'the-kitchen-pottery-labels', 'the-studio-in-winter', 'things-we-keep-on-the-wall', 'type-that-holds-its-lines', 'widows-orphans-and-phones'];
const CASES = ['high-street-coffee', 'kitchen-pottery', 'nature-films', 'oak-furniture', 'sourdough-bakery', 'the-hill-guides', 'tiny-publisher', 'weekend-bikes'];
function P(label, slug, o = {}, kids = []) { return { id: o.id || slug, kind: 'page', label, slug, hidden: !!o.hidden, holds: o.holds || null, kids }; }
function G(label, slug, kids = [], o = {}) { return { id: o.id || slug, kind: 'group', label, slug, kids, isNew: !!o.isNew }; }
function base() {
  // The rule's order (Decision 7): Home; then pages and groups with pages or a held collection under them, A–Z; then the rest, A–Z.
  // The starter's page at /faq is titled "Questions", so it sorts last. Field notes is set hidden for this mockup.
  return [
    P('Home', 'index', { id: 'home' }),
    P('About', 'about', {}, [P('Team', 'team')]),
    P('Journal', 'journal', { holds: { label: 'Journal', icon: 'journal', count: 24, one: 'post', many: 'posts', docs: POSTS.slice() } }),
    G('Services', 'services', [P('Branding', 'branding'), P('Websites', 'websites')]),
    G('Studio', 'studio', [P('Visit', 'visit')]),
    P('Work', 'work', { holds: { label: 'Case studies', icon: 'case', count: 8, one: 'case study', many: 'case studies', docs: CASES.slice() } }),
    P('Contact', 'contact'),
    P('Field notes', 'field-notes', { hidden: true }),
    P('Privacy', 'privacy'),
    P('Questions', 'faq'),
  ];
}

/* ══ The tree model ══ */
function index(tree) {
  const m = new Map();
  const walk = (nodes, parent, pp, hid) => nodes.forEach((n, i) => {
    const path = pp ? `${pp}/${n.slug}` : n.slug;
    const h = hid || (n.kind === 'page' && n.hidden);
    m.set(n.id, { n, parent, path, hidden: h, i });
    walk(n.kids, n.id, path, h);
  });
  walk(tree, null, '', false);
  return m;
}
const addrOf = (x) => (x.n.kind === 'group' ? `/${x.path}/` : x.path === 'index' ? '/' : `/${x.path}`);
function locate(tree, id, parentId = null) {
  for (let i = 0; i < tree.length; i++) {
    const n = tree[i];
    if (n.id === id) return { list: tree, i, node: n, parentId };
    const r = locate(n.kids, id, n.id);
    if (r) return r;
  }
  return null;
}
function moveNode(tree, id, parentId, beforeId) {
  const s = locate(tree, id);
  s.list.splice(s.i, 1);
  const list = parentId ? locate(tree, parentId).node.kids : tree;
  let at = beforeId ? list.findIndex((x) => x.id === beforeId) : -1;
  if (at < 0) at = list.length;
  list.splice(at, 0, s.node);

    const newKids = (p ? n.get(p).n.kids : S.tree).map((k) => k.id).filter((id) => oldKids.includes(id));

  const id = S.renaming.id;
  const c = nameCheck(S.renaming.value, siblingsOf(id), id);
  if (c.bad) return;
  if (c.merge) {
    const g = locate(S.tree, id); g.list.splice(g.i, 1);
    const p = locate(S.tree, c.merge).node; p.kids = p.kids.concat(g.node.kids);
  } else renameGroup(id, S.renaming.value.trim());
  S.renaming = null;
  render();
}
document.addEventListener('input', (e) => {
  if (e.target.id === 'ng-in') { S.naming.value = e.target.value; patchName('ng', nameCheck(S.naming.value, S.tree, null), () => 'Goes at the end of the top level. Then drag pages onto it.'); }
  if (e.target.id === 'rn-in') { const id = S.renaming.id; S.renaming.value = e.target.value; const c = nameCheck(S.renaming.value, siblingsOf(id), id); patchName('rn', c, () => renameHelp(locate(S.tree, id).node)); $('#rn-addr').textContent = groupAddrFor(id, c.slug); }
});
function patchName(key, c, help) {
  const sub = $(`#${key}-sub`);
  const html = subLine(c, sub.style.getPropertyValue('--depth') || 0, key, help());
  sub.outerHTML = html;
  if (key === 'ng') { $('#ng-addr').textContent = `/${c.slug || '…'}/`; $('#ng-ok').disabled = c.bad; $('#ng-in').toggleAttribute('aria-invalid', !!c.err); }
  else { $('#rn-ok').disabled = c.bad; $('#rn-in').toggleAttribute('aria-invalid', !!c.err); }
}
document.addEventListener('change', (e) => { if (e.target.id === 'rv-tick') { S.tick = e.target.checked; render(); } });
document.addEventListener('keydown', (e) => {
  if (e.target.id === 'ng-in') { if (e.key === 'Enter') confirmNaming(); if (e.key === 'Escape') { S.naming = null; render(); } return; }
  if (e.target.id === 'rn-in') { if (e.key === 'Enter') confirmRename(); if (e.key === 'Escape') { S.renaming = null; render(); } return; }
  if (e.key === 'Escape' && DRAG) { endDrag(false); return; }
  if (e.target.closest('input, textarea')) return;
  if (e.key === ']') step(1);
  if (e.key === '[') step(-1);
});
$('#stage').addEventListener('pointerdown', onPointerDown);
addEventListener('pointermove', onPointerMove);
addEventListener('pointerup', () => endDrag(true));
addEventListener('pointercancel', () => endDrag(false));
addEventListener('resize', () => { if (S.drag && !DRAG) renderStage(); else placeMarker(); });
// Hovering an entry in the review washes its row in the tree
document.addEventListener('mouseover', (e) => {
  const li = e.target.closest('.rv-e[data-link]');
  $$('#atree .arow.is-linked').forEach((r) => r.classList.remove('is-linked'));
  if (li) rowEl(li.dataset.link)?.classList.add('is-linked');
});

/* ══ States: each at its own address ══ */
const mixed = () => {
  // New group Company after Home, with About (and Team), Journal (and its posts) and Contact in it; Services renamed Offerings;
  // Visit out of Studio to the top level (Studio goes); Questions into Field notes, which is hidden.
  const c = addGroup('Company', 'about');
  moveNode(S.tree, 'about', c, null);
  moveNode(S.tree, 'journal', c, null);
  moveNode(S.tree, 'contact', c, null);
  renameGroup('services', 'Offerings');
  moveNode(S.tree, 'visit', null, 'field-notes');
  moveNode(S.tree, 'faq', 'field-notes', null);
};
const STATES = [
  { id: 'entry', g: 'Opening', label: 'The Pages tree’s header: Arrange pages…', run() { S.mode = 'entry'; } },
  { id: 'open', g: 'Opening', label: 'Just opened: the rule’s order, Home fixed, held collections, a hidden page', run() {} },
  { id: 'drag-beside', g: 'Dragging', label: 'Mid-drag, beside: Journal above About (order only)', run() { S.drag = { id: 'journal', target: { kind: 'beside', parentId: null, beforeId: 'about', rowId: 'about', edge: 'top', depth: 0, same: true, tag: 'Top level' } }; } },
  { id: 'drag-inside', g: 'Dragging', label: 'Mid-drag, inside: Contact onto the new Company group', run() { const c = addGroup('Company'); moveNode(S.tree, 'about', c, null); S.drag = { id: 'contact', target: { kind: 'inside', parentId: c, beforeId: null, rowId: c, depth: 1, tag: 'Inside Company' } }; } },
  { id: 'drag-deeper', g: 'Dragging', label: 'Mid-drag, beside one level down: Questions first under About', run() { S.drag = { id: 'faq', target: { kind: 'beside', parentId: 'about', beforeId: 'team', rowId: 'about', edge: 'bottom', depth: 1, tag: 'In About' } }; } },
  { id: 'refused-home', g: 'Dragging', label: 'Refused: Privacy onto Home', run() { S.drag = { id: 'privacy', target: { kind: 'refused', rowId: 'home', reason: 'Home takes no pages' } }; } },
  { id: 'refused-slug', g: 'Dragging', label: 'Refused: a Team beside a Team', run() { locate(S.orig, 'studio').node.kids.push(P('Team', 'team', { id: 'studio-team' })); S.tree = clone(S.orig); S.drag = { id: 'studio-team', target: { kind: 'refused', rowId: 'team', reason: 'There’s already a page called Team here' } }; } },
  { id: 'refused-held', g: 'Dragging', label: 'Refused: onto a held collection’s row', run() { S.drag = { id: 'privacy', target: { kind: 'refused', rowId: 'held:journal', reason: 'Moves with Journal: drop on Journal instead' } }; } },
  { id: 'group-naming', g: 'Groups', label: 'New group, being named', run() { S.naming = { value: 'Company' }; } },
  { id: 'group-clash', g: 'Groups', label: 'New group taking a sibling group’s name', run() { S.naming = { value: 'Studio' }; } },
  { id: 'group-empty', g: 'Groups', label: 'A new group left empty: Review… off, with the reason', run() { addGroup('Later'); moveNode(S.tree, 'visit', null, 'work'); } },
  { id: 'group-rename', g: 'Groups', label: 'A group’s Rename…, inline', run() { S.renaming = { id: 'services', value: 'Offerings' }; } },
  { id: 'changed', g: 'Review', label: 'Arranged, before review: what moved or was renamed is marked', run() { mixed(); } },
  { id: 'review-order', g: 'Review', label: 'Review: the order only', run() { moveNode(S.tree, 'journal', null, 'about'); S.mode = 'review'; } },
  { id: 'review', g: 'Review', label: 'Review: addresses, a holder’s posts (closed), Studio goes, hidden, the tick', run() { mixed(); S.mode = 'review'; } },
  { id: 'review-posts', g: 'Review', label: 'Review: the holder’s posts, open', run() { mixed(); S.mode = 'review'; S.openHeld.add('journal'); } },
  { id: 'review-shown', g: 'Review', label: 'Review: out from under a hidden page, will be shown', run() { moveNode(S.orig, 'faq', 'field-notes', null); S.tree = clone(S.orig); moveNode(S.tree, 'faq', null, null); S.mode = 'review'; } },
  { id: 'applying', g: 'Review', label: 'Applying', run() { mixed(); S.mode = 'applying'; } },
  { id: 'applied', g: 'Review', label: 'Applied: the sidebar’s new tree, waiting to publish', run() { mixed(); finishApply(); } },
  { id: 'refused-lock', g: 'Trouble', label: 'Refused: someone else is editing a page that moves', run() { mixed(); S.mode = 'review'; S.note = 'lock'; } },
  { id: 'changed-underneath', g: 'Trouble', label: 'Shown again: something changed underneath', run() {
    locate(S.orig, 'services').node.kids.push(P('Kitchen pottery', 'kitchen-pottery', { id: 'kiln' }));
    const h = locate(S.orig, 'journal').node.holds; h.count = 25; h.docs.unshift('the-new-letterpress');
    S.tree = clone(S.orig); mixed(); S.mode = 'review'; S.note = 'underneath'; S.added.add('kiln'); S.addedDocs.add('the-new-letterpress'); S.openHeld.add('journal');
  } },
  { id: 'apply-failed', g: 'Trouble', label: 'Couldn’t apply: everything put back', run() { mixed(); S.mode = 'review'; S.note = 'failed'; } },
  { id: 'leave', g: 'Leaving', label: 'Leaving with changes not applied: the ask', run() { mixed(); S.modal = 'leave'; } },
];
function applyState(id) {
  const st = STATES.find((s) => s.id === id) || STATES[1];
  UID = 0;
  S = fresh();
  S.stateId = st.id;
  S.tree = clone(S.orig);
  st.run();
  render();
}
function step(d) { const i = STATES.findIndex((s) => s.id === S.stateId); const n = STATES[(Math.max(i, 0) + d + STATES.length) % STATES.length]; location.hash = n.id; }

/* ══ Mockup review tool ══ */
let mkOpen = false;
function renderMk() {
  const i = STATES.findIndex((s) => s.id === S.stateId);
  const lbl = i >= 0 ? `<b>${i + 1}/${STATES.length}</b> ${esc(STATES[i].label)}` : '<b>Live</b> you’ve changed it by hand';
  let panel = '';
  if (mkOpen) {
    const groups = [...new Set(STATES.map((s) => s.g))];
    panel = `<div class="mkr-panel" role="region" aria-label="Mockup states">${groups.map((g) => `<h4>${g}</h4>${STATES.map((s, k) => (s.g === g ? `<a class="mkr-s${s.id === S.stateId ? ' on' : ''}" href="#${s.id}"><span class="n">${k + 1}</span><span>${esc(s.label)}</span></a>` : '')).join('')}`).join('')}
    <h4>Try it</h4><ul><li>Every state is live: drag any row (not Home, not a held collection), use New group, a group’s Rename…, Review…, Apply. [ and ] step through the states.</li><li>Hover an entry in the review to find its row in the tree.</li></ul>
    <h4>Rules a static file can’t show</h4><ul><li>The screen is at /admin/arrange. A reload reopens it with nothing arranged (the browser’s own “Leave site?” asks first); Back, Cancel, the CaraCMS tab or another document ask with the dialog when something is arranged.</li><li>Mouse only (Decision 4). Every button keeps the editor’s focus ring.</li><li>Live mode is drawn (Niamh signed in, Aoife in another browser). In local mode the tick’s help drops “Goes live at the next Publish” and Apply writes to disk, as Change address… does.</li><li>No side rails: dragged, target, changed and refused rows are washes, full rings, chips and lines.</li></ul></div>`;
  }
  $('#mkr').innerHTML = `<div class="mkr-tab"><button type="button" class="mkr-b" data-mk="prev" aria-label="Previous state">◀</button><span class="lbl">${lbl}</span><button type="button" class="mkr-b" data-mk="next" aria-label="Next state">▶</button><button type="button" class="mkr-b${mkOpen ? ' on' : ''}" data-mk="toggle">States</button></div>${panel}`;
}
$('#mkr').addEventListener('click', (e) => {
  const b = e.target.closest('[data-mk]');
  if (!b) return;
  if (b.dataset.mk === 'toggle') { mkOpen = !mkOpen; renderMk(); }
  if (b.dataset.mk === 'next') step(1);
  if (b.dataset.mk === 'prev') step(-1);
});
addEventListener('hashchange', () => applyState(location.hash.slice(1)));
applyState(location.hash.slice(1) || 'open');
</script>
</body>
