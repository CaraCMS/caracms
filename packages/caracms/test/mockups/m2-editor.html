<!doctype html>
<!--
  caracms — the editor's look: the consoles' "soft brutal" look on M2's design language (full mockup)
  Spec: the editor restyle · The look: the consoles' design system (Decisions 1–3).
  The editor restyle's mockup (signed off 2026-10-29, revised for Decision 12 on 2026-11-03), folded into M2's at build:
  one look, no Before / After. AUTHORITATIVE for the tokens on :root, the pressed buttons, the frames (which states get
  them: the review panel's "The frame: needs you" and "Calm on purpose") and the dark bar. The visual tests' reference.
  Site Settings' accent is a radio group of presets (PRESETS in the script; #settings-accent-custom, a stored colour that
  isn't one, shown first as "Current"); the review panel's Brand presets strip shows each preset on the branded slots.
  New state over M2: #discard (Discard changes, the lose-work dialog).

  ── M2's header ──
  caracms — M2, the editor's design language (full mockup)
  Spec: M2, the design language · Direction: the editor-shell sketches, 4d (one bar, at the bottom)
  AUTHORITATIVE for layout, hierarchy, every state in Phase 2's inventory and how each looks, the tokens on :root,
  the preview overlays and the components. ILLUSTRATIVE: the sample site inside the preview (M7 builds the starter),
  the sample content, and copy outside Decision 17's quoted list.
  The purple dashed "Mockup" panel (top right) is a review tool, not part of the design.
  Revised for M3 (the spec's Mockup revision) and for M5a:
  the field kinds, shared blocks as their own level and document, Site Settings, creating and deleting.
  Revised for M5b (the spec's Mockup revision): the media field (images, clips, the focal point,
  alt text asked for and warned in amber), the library (a picker from the field, and its own level from Site-wide → Media),
  Publish's summary with images missing alt text (it warns, never blocks), the brand's logo and icon, and the media
  blocks on the stage. Pictures are drawn by .ph/.ph-in, the stand-in for an <img> with object-fit and object-position.
  Revised for rich text typed on the page (on-page rich text): the states tagged RT, the formatting
  bar and the link popover drawn in the preview's overlay layer (#cms-rt, overlayCSS).
  Open with any static server, e.g. python3 -m http.server --directory packages/caracms/test/mockups
-->

<style>
/* ══════════════════════════════════════════════════════════════════════════
   TOKENS — semantic custom properties M3 lifts as-is (Decision 1, 7).
   Light only; a dark set would redefine these names, never the components.
   ══════════════════════════════════════════════════════════════════════════ */
:root{
  /* Colour · neutral chrome */
  --surface:#fffefc;              /* sidebar, popovers, cards, inputs */
  --surface-sunken:#f6f4ee;       /* trail, strips, sign-in page */
  --surface-tab:#ebe8e0;          /* levels stacked in the drill-down trail */
  --surface-tab-near:#f1eee7;     /* the level just above the current one */
  --surface-hover:#f2efe7;
  --surface-pressed:#e9e5dc;
  --border:#e6e2d8;
  --border-strong:#c8c2b5;        /* inputs and buttons */
  --border-hover:#aaa494;
  --text:#26231c;
  --text-muted:#5f574c;           /* 6.3:1 on surface, 5.8:1 on sunken */
  --text-subtle:#665e52;          /* 5.8:1 on surface, 5.3 on sunken, 4.8 on tab, 4.6 on pressed: meta text only */
  --icon:#72685a;
  --ink-hover:#3d372e;            /* the ink button's hover */
  --on-fill:#ffffff;              /* text and icons on a filled colour: danger, phone, ink tags, avatars */
  --scrim:rgba(38,32,24,.48);
  --backdrop:#14110e;             /* behind the editor when it's sized smaller than the window */
  --frame-bg:#ffffff;             /* a preview frame before its page paints */
  /* Colour · stage (behind the preview) and the one bar */
  --stage:#2c2620;
  --stage-dim:rgba(44,38,32,.86);  /* over the held preview when a document has none of its own (Site Settings, M5a) */
  --bar-bg:#1f1b16;
  --bar-raised:#332d26;
  --bar-raised-hover:#3f382f;
  --bar-border:#3b342c;
  --bar-border-strong:#554b3f;
  --bar-border-hover:#726656;
  --tooltip-bg:#15120f;
  --bar-text:#f4efe6;
  --bar-muted:#b8ad9c;            /* 7.4:1 on bar-bg */
  --bar-control:#f4efe6;          /* the off-white control on the dark bar */
  --bar-control-text:#26231c;
  --bar-off:#38312a;              /* a control that's visibly off */
  --bar-off-text:#aca190;
  /* Colour · tool colours: fixed, never the brand */
  --select:#1463f3; --select-strong:#0f56d9; --select-wash:#ebf2ff; --select-halo:rgba(20,99,243,.2);
  --phone:#0a7266; --phone-strong:#075e54; --phone-wash:#e7f4f1; --phone-field:#f7fbfa; --phone-border:#9dd2c8; --phone-halo:rgba(10,114,102,.2);
  --focus:#1463f3; --focus-on-dark:#8fb8ff;
  /* Colour · status: fixed, never the brand (Decision 5) */
  --status-warning:#94500a; --status-warning-strong:#6b3a06; --status-warning-dot:#e08a00; --status-warning-wash:#fdf2da; --status-warning-border:#e8c682;
  --status-warning-on-dark:#ffc46b; --status-warning-dark-wash:#3a2a10; --status-warning-dark-border:#6b4a14;
  --status-danger:#b42318;  --status-danger-strong:#8a1a12; --status-danger-hover:#9a1d14; --status-danger-dot:#e5372a; --status-danger-wash:#fdeee9; --status-danger-border:#eebbb0; --status-danger-halo:rgba(180,35,24,.14);
  --status-danger-on-dark:#ff9a90; --status-danger-dark-border:#7a2a22;
  --status-live:#17743d;    --status-live-dot:#2fa45a;    --status-live-wash:#e9f3e6;    --status-live-border:#b5d6b4;   --status-live-on-dark:#7bdb9c;
  --status-waiting:#5b42c9; --status-waiting-dot:#7a5ae6; --status-waiting-wash:#f2eefd; --status-waiting-border:#d4c9f7; --status-waiting-on-dark:#bdabff;
  --status-locked:#4f5866;  --status-locked-wash:#eeebe5; --status-locked-border:#d6d0c5;
  /* Colour · preview overlays, drawn inside the iframes over any site (Decision 6) */
  --ov:#1463f3;                   /* outline core */
  --ov-text:#0f56d9;
  --ov-halo:rgba(255,255,255,.95);/* the second tone, both sides of the core */
  --ov-on:#ffffff;                /* text on a filled overlay tag */
  --ov-surface:#ffffff;           /* hover tags and insert-point pills */
  --ov-wash:rgba(20,99,243,.07);  /* hover fill */
  --ov-phone:#0a7266;             /* phone lines */
  --ov-warn:#e08a00; --ov-warn-text:#6e3c05; --ov-warn-wash:#fff6e3;
  --ov-ring:rgba(20,99,243,.18);  /* the soft ring while typing on the page */
  --ov-lift:rgba(0,0,0,.28);      /* shadow under insert points */
  --ov-veil-a:rgba(255,255,255,.28); --ov-veil-b:rgba(17,17,15,.16); /* the lock veil's two-tone hatch */
  /* Colour · people (avatars) */
  --p-niamh:#4f6aa8; --p-aoife:#a24f7c; --p-ciaran:#8a6a2e;
  /* Brand slots (Site Settings › Editor branding). Set by the brand switcher; ink and edge are computed by contrast */
  --accent:#1f2f57; --accent-ink:#ffffff; --accent-edge:#1f2f57;
  /* Type */
  --font-ui:"Instrument Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-mono:"Geist Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --text-2xs:10.5px; --text-xs:11px; --text-sm:12px; --text-base:13px; --text-md:14px; --text-lg:16px; --text-xl:19px; --text-2xl:24px;
  --leading-tight:1.2; --leading:1.45; --leading-loose:1.55;
  --weight-regular:400; --weight-medium:500; --weight-semibold:600; --weight-bold:700;
  --tracking-caps:.06em; --tracking-tight:-.01em;
  /* Space */
  --space-0-5:2px; --space-1:4px; --space-1-5:6px; --space-2:8px; --space-2-5:10px; --space-3:12px; --space-4:16px; --space-5:20px; --space-6:24px; --space-8:32px; --space-10:40px;
  /* Radius */
  --radius-xs:3px; --radius-sm:5px; --radius-md:7px; --radius-lg:10px; --radius-xl:14px; --radius-pill:999px;
  /* Shadow */
  --shadow-control:0 var(--press-depth) 0 var(--edge-secondary);
  --shadow-raised:0 1px 0 var(--edge-secondary);   /* a switch knob, the chosen segment */
  --shadow-pop:var(--shadow-hard-neutral);
  --shadow-drag:var(--shadow-hard-neutral);
  --shadow-modal:var(--shadow-hard-neutral);
  --shadow-frame:0 0 0 1px rgba(255,242,222,.08),var(--hard-offset) var(--hard-offset) 0 #15120e;
  /* Motion (all zero under reduced motion) */
  --dur-fast:120ms; --dur-base:180ms; --dur-slow:320ms; --dur-pulse:900ms;
  --ease-out:cubic-bezier(.2,.8,.2,1); --ease-in-out:cubic-bezier(.45,0,.25,1);
  /* Layout */
  --bar-h:44px; --sidebar-w:320px; --row-h:30px; --control-h:32px; --control-h-sm:26px; --pop-gap:8px; --frame-pad:16px;
  /* Pages tree (M3 Decision 8): the twisty's column, and one step of indent (the twisty plus the row's gap, so a child's icon sits under its parent's name) */
  --tree-twisty:16px; --tree-indent:24px;
  /* Media (M5b): a slot's thumbnail, the library's grid (columns at the sidebar's width), the focal point's ring */
  --thumb-w:64px; --thumb-h:48px; --lib-cols:3; --focal-ring:22px; --focal-max-h:220px;
  /* Submissions (M6): the unread mark, a submission's sheet in the stage, its label column */
  --unread:var(--select); --sub-sheet-w:640px; --sub-label-w:168px;
  /* Layers */
  --z-frame:1; --z-bar:20; --z-pop:40; --z-toast:45; --z-modal:60; --z-screen:80;
  /* The hard-edge geometry (the consoles'). Every hard shadow is unblurred and at most 2px. */
  --press-depth:2px;              /* a button's bottom edge, and how far it sinks when pressed */
  --hard-offset:2px;              /* a framed or floating object's shadow */
  --frame-width:1.5px;            /* the border of a framed (needs-you) object */
  --swatch-size:28px;             /* an accent preset in Site Settings (Decision 12): Current and six presets fit the 276px field */

  /* Edges: a button's pressed edge, darker than its face (new) */
  --edge-secondary:#aa9e8b;       /* .btn, .ib.boxed */
  --edge-ink:#0f0d0a;             /* anything still drawn in ink (since Decision 12 .btn.ink wears the accent and --edge-accent) */
  --edge-danger:#7a170f;          /* .btn.danger */
  --edge-phone:#04463e;           /* .btn.phone */
  /* The brand's: a darker shade of whatever accent the site has, pale or dark, toward a warm near-black.
     Pure CSS, so it follows --accent wherever it's set (the route, sign-in, Site Settings' live accent) with
     no new slot in brand.ts. #1f2f57 navy gives #1d2337; #f6e27f yellow gives #9b8c4f. */
  --edge-accent:color-mix(in oklab,var(--accent) 62%,#140d06);
  /* Publish: a fixed caracms green whatever the site's brand, since it's the "goes live" action (2026-10-29;
     replaces M2 Decision 5's accent on the Publish count and the final Publish button). From the live green family,
     a touch deeper than --status-live (#17743d) to sit with the warm neutrals. White on it is 6.4:1, 8.0 on hover. */
  --publish:#1c6d3a;
  --publish-hover:#185c30;
  --publish-ink:#ffffff;
  --publish-edge:#123d1f;         /* its pressed edge and border: a darker, warm-leaning green */
  /* On the dark bar: the edge is lighter than the bar, so it still reads (the consoles' dark mode does the same) */
  --edge-bar:#5c5246;             /* raised dark controls: the document button, Publish */
  --edge-bar-control:#a69a86;     /* the off-white control on dark: the toast's and the stage's buttons */

  /* Frames: the border of a needs-you object, and of floating ones (new) */
  --frame-neutral:#b5a994;        /* popovers, menus, dialogs */
  --frame-warning:#c99c48;        /* field problems, warning notices */
  --frame-danger:#d4897a;         /* errors, danger notices, a destructive or lose-work dialog */
  --frame-warning-on-dark:#a67d33;/* Preview not updated, on the bar */
  --frame-danger-on-dark:#c95646; /* Can't reach the server, Not kept, Publish failed, on the bar */

  /* Hard shadows, tinted to the object's own colour (new) */
  --shadow-hard-neutral:var(--hard-offset) var(--hard-offset) 0 #aa9e8b;
  --shadow-hard-warning:var(--hard-offset) var(--hard-offset) 0 #d6ae62;
  --shadow-hard-danger:var(--hard-offset) var(--hard-offset) 0 #dc9a8c;
  --shadow-hard-warning-on-dark:var(--hard-offset) var(--hard-offset) 0 #5e4517;
  --shadow-hard-danger-on-dark:var(--hard-offset) var(--hard-offset) 0 #6a2419;
  --shadow-edge:0 1px 0 #ddd4c4;  /* the soft 1px edge under a card at rest (an open list item, the sign-in card) */
}
@media (prefers-reduced-motion:reduce){:root{--dur-fast:0ms;--dur-base:0ms;--dur-slow:0ms;--dur-pulse:0ms}}
:root[data-motion="reduce"]{--dur-fast:0ms;--dur-base:0ms;--dur-slow:0ms;--dur-pulse:0ms}

/* ══ Base ══ */
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:var(--weight-regular) var(--text-base)/var(--leading) var(--font-ui);color:var(--text);background:var(--backdrop);-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer}
p{margin:0}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.i{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.i-sm{width:14px;height:14px}.i-xs{width:12px;height:12px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
kbd{display:inline-block;min-width:18px;padding:2px 4px;border:1px solid var(--border);border-bottom-width:2px;border-radius:var(--radius-xs);background:var(--surface);color:var(--text-muted);font:var(--weight-medium) var(--text-2xs)/1 var(--font-mono);text-align:center}
.mono{font-family:var(--font-mono)}
.muted{color:var(--text-muted)}
[hidden]{display:none!important}

#viewport{position:fixed;inset:0;overflow:hidden;background:var(--backdrop)}
#pops,#toast-root,#modal-root{position:absolute;inset:0;pointer-events:none}
#pops{z-index:var(--z-pop)}#toast-root{z-index:var(--z-toast)}#modal-root{z-index:var(--z-modal)}
#pops>*,#toast-root>*,#modal-root>*{pointer-events:auto}
#app{position:absolute;inset:0;container:app / size;overflow:hidden;background:var(--surface-sunken)}
#app.sized{inset:auto;left:50%;top:50%;transform-origin:50% 50%}

/* ══ Editor shell: one left pane, the preview, one bar along the bottom ══ */
.editor{--side-col:var(--sidebar-w);position:absolute;inset:0;display:grid;grid-template-columns:var(--side-col) minmax(0,1fr);grid-template-rows:minmax(0,1fr) var(--bar-h)}
/* The sidebar hidden (the bar's button, ⌘\\): its column goes, the preview takes the width (the stage rescales itself). The bar keeps its shape. */
.editor[data-side="hidden"]{--side-col:0px}
.editor[data-side="hidden"]>.side{display:none}
@container app (min-width:1680px){.editor{--sidebar-w:360px}}

/* ── Sidebar (Tina-style drill-down) ── */
.side{grid-row:1;grid-column:1;position:relative;display:flex;flex-direction:column;min-height:0;background:var(--surface);border-right:1px solid var(--border);z-index:2}
.trail{flex:none;padding:var(--space-3) 0 0;background:var(--surface-sunken);border-bottom:1px solid var(--border)}
.lv{display:flex;align-items:center;gap:var(--space-2);width:calc(100% - 2 * var(--space-4));height:28px;margin:0 var(--space-4);padding:0 var(--space-2);border:1px solid var(--border);border-bottom:0;border-radius:var(--radius-md) var(--radius-md) 0 0;background:var(--surface-tab);color:var(--text-muted);font-size:var(--text-sm);text-align:left;white-space:nowrap;transition:background var(--dur-fast)}
.lv+.lv{width:calc(100% - 2 * var(--space-2));margin:0 var(--space-2);background:var(--surface-tab-near)}
.lv:hover{background:var(--surface-hover);color:var(--text)}
.lv b{color:var(--text);font-weight:var(--weight-semibold);overflow:hidden;text-overflow:ellipsis}
.lv .n{margin-left:auto;font-size:var(--text-xs);color:var(--text-subtle)}
.cur{position:relative;padding:var(--space-2) var(--space-4) var(--space-2-5);background:var(--surface);border-top:1px solid var(--border)}
/* The header and the body are one surface: the header spans the pane, with one hairline (the trail's) under it; with no tabs above, no strip either. */
.trail:has(> .cur:first-child){padding-top:0}
.trail > .cur:first-child{border-top:0}
.cur-row{display:flex;align-items:center;gap:var(--space-2);min-height:28px}
.cur-title{flex:1;min-width:0;display:flex;flex-direction:column;line-height:var(--leading-tight)}
.cur-title .t{display:flex;align-items:center;gap:var(--space-1-5);font-size:var(--text-lg);font-weight:var(--weight-semibold);letter-spacing:var(--tracking-tight);white-space:nowrap;overflow:hidden}
.cur-title .t span{overflow:hidden;text-overflow:ellipsis}
.cur-title .t .crumbp{color:var(--text-muted);font-weight:var(--weight-medium)}
.cur-title .sub{margin-top:2px;font-size:var(--text-xs);color:var(--text-subtle);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* A sub line with chips (a case study's kind, New, Read-only): the chips stay whole, the address gives way. */
.cur-title .sub:has(> .chip){display:flex;align-items:center;gap:var(--space-1-5)}
.cur-title .sub > .chip{flex:none}
.cur-title .sub > .mono{min-width:0;overflow:hidden;text-overflow:ellipsis}
.ib{display:inline-grid;place-items:center;width:28px;height:28px;flex:none;padding:0;border:1px solid transparent;border-radius:var(--radius-md);background:none;color:var(--icon);transition:background var(--dur-fast),color var(--dur-fast)}
.ib:hover{background:var(--surface-hover);color:var(--text)}
.ib.boxed{border-color:var(--border-strong);background:var(--surface)}
.ib[aria-expanded="true"]{background:var(--surface-pressed);color:var(--text)}
.ib:disabled{color:var(--border-hover);cursor:not-allowed;background:none}
.side-body{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain;padding:var(--space-4);scrollbar-width:thin;scrollbar-color:transparent transparent;scrollbar-gutter:stable;transition:scrollbar-color var(--dur-base)}
/* The body's scrollbar: thin, shown on hover or while scrolling (Pane.tsx's data-scrolling), its gutter kept so nothing shifts. */
.side-body:hover,.side-body[data-scrolling]{scrollbar-color:var(--border-hover) transparent}
.side-body.flush{padding-top:0}
.side-foot{flex:none;display:flex;align-items:center;gap:var(--space-2);padding:var(--space-2) var(--space-3);border-top:1px solid var(--border);background:var(--surface-sunken);overflow:hidden}
.side-foot .lbl{flex:none;font-size:var(--text-xs);font-weight:var(--weight-semibold);color:var(--text-subtle)}
.rchips{display:flex;gap:var(--space-1);overflow-x:auto;scrollbar-width:none}
.rchip{display:inline-flex;align-items:center;gap:var(--space-1-5);height:24px;padding:0 var(--space-2);border:1px solid var(--border);border-radius:var(--radius-md);background:var(--surface);font-size:var(--text-sm);color:var(--text);white-space:nowrap;flex:none}
.rchip:hover{border-color:var(--border-hover)}
.rchip.is-current{background:var(--select-wash);border-color:var(--select);color:var(--select-strong);font-weight:var(--weight-semibold)}
.wmark{display:inline-flex;color:var(--status-warning-dot)}
.dot{width:7px;height:7px;border-radius:50%;flex:none;background:var(--status-waiting-dot)}
.dot.warn{background:var(--status-warning-dot)}
.dot.danger{background:var(--status-danger-dot)}
.dot.live{background:var(--status-live-dot)}

/* Documents level */
.find{position:relative;margin:var(--space-3) 0 var(--space-2)}
.find .i{position:absolute;left:10px;top:50%;translate:0 -50%;color:var(--icon)}
.find .input{padding-left:32px}
.grp{margin-top:var(--space-2)}
.grp-h{position:sticky;top:0;z-index:1;display:flex;align-items:center;gap:var(--space-1-5);height:32px;margin:0 calc(-1 * var(--space-1));padding:0 var(--space-1);background:var(--surface);font-size:var(--text-xs);font-weight:var(--weight-semibold);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--text-muted)}
.grp-h .n{font-weight:var(--weight-medium);letter-spacing:0;color:var(--text-subtle)}
.grp-h .sp{flex:1}
.grp-h .linkbtn{text-transform:none;letter-spacing:0;font-size:var(--text-sm)}
.drow{display:flex;align-items:center;gap:var(--space-2);width:100%;min-height:var(--row-h);padding:0 var(--space-2);border:1px solid transparent;border-radius:var(--radius-md);background:none;text-align:left;font-size:var(--text-base);color:var(--text);transition:background var(--dur-fast)}
.drow:hover{background:var(--surface-hover)}
.drow .i{color:var(--icon)}
.drow .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.drow .meta{display:inline-flex;align-items:center;gap:var(--space-1-5);font-size:var(--text-xs);color:var(--text-subtle);white-space:nowrap}
.drow .meta .who{color:var(--text-muted);font-weight:var(--weight-medium)}
.drow.is-current{background:var(--select-wash);border-color:var(--select);color:var(--select-strong);font-weight:var(--weight-semibold)}
.drow.is-current .i{color:var(--select-strong)}
.empty{display:flex;flex-direction:column;align-items:flex-start;gap:var(--space-1-5);padding:var(--space-3);border:1px dashed var(--border-strong);border-radius:var(--radius-lg);color:var(--text-muted);font-size:var(--text-sm)}
.empty b{color:var(--text);font-size:var(--text-base);font-weight:var(--weight-semibold)}
.drow .nm .crumb{color:var(--text-subtle);font-weight:var(--weight-medium)}

/* The focal point on a thumbnail: the overlay's two-tone ring, so it reads on any picture */
.fp-dot{position:absolute;width:10px;height:10px;margin:-5px 0 0 -5px;border:2px solid var(--ov);border-radius:50%;box-shadow:0 0 0 1px var(--ov-halo),inset 0 0 0 1px var(--ov-halo)}
/* The media field: what's in the slot (a card), its actions, then what it needs (focal point, alt text, a clip's settings) */
.media{border:1px solid var(--border-strong);border-radius:var(--radius-md);background:var(--surface);overflow:hidden}

.mdrop.is-over .when-idle{display:none}
.mdrop.is-over .when-over{display:inline}
.mdrop.sm{flex-direction:row;align-items:center;gap:var(--space-2);padding:var(--space-1-5) var(--space-1-5) var(--space-1-5) var(--space-2-5);text-align:left}

.mdrop.sm .t{flex:1;min-width:0}
/* Alt text: asked for right after placing (the tool's blue), warned in amber when skipped. Neither blocks anything. */

.field-ask{display:flex;align-items:flex-start;gap:var(--space-1-5);margin-top:var(--space-1-5);font-size:var(--text-sm);color:var(--select-strong);font-weight:var(--weight-medium)}

/* The focal point, set on the image's own preview: a click or a drag puts it, the arrow keys move it 5% */
.fp{margin-top:var(--space-2)}

.fp-img{position:relative;width:min(100%,calc(var(--focal-max-h) * var(--r,1.5)));aspect-ratio:var(--r,1.5);border-radius:var(--radius-xs);cursor:crosshair;touch-action:none;user-select:none}

.media-field .mini-seg{margin:0 0 var(--space-1)}
.fr{margin-top:var(--space-2)}
.fr-vid{aspect-ratio:16/9;border-radius:var(--radius-md)}
.fr-time{position:absolute;left:var(--space-2);bottom:var(--space-2);z-index:1;height:18px;padding:0 6px;display:inline-flex;align-items:center;border-radius:var(--radius-xs);background:color-mix(in srgb,var(--tooltip-bg) 74%,transparent);color:var(--on-fill);font:var(--weight-medium) var(--text-2xs)/1 var(--font-mono)}
.fr-range{display:block;width:100%;margin:var(--space-2) 0 0;accent-color:var(--select)}
.fr-row{display:flex;align-items:center;gap:var(--space-2);margin-top:var(--space-1);font-size:var(--text-xs);color:var(--text-muted);font-variant-numeric:tabular-nums}
.fr-row .btn{margin-left:auto}
/* A gallery's images in M5a's list rows: a small 4:5 picture in each summary */
.item-sum .mini{width:22px;height:28px;flex:none;border-radius:var(--radius-xs)}

.switch.sm{height:26px;gap:var(--space-1-5);font-size:var(--text-sm);color:var(--text-muted)}

.lgrid{display:grid;grid-template-columns:repeat(var(--lib-cols),minmax(0,1fr));gap:var(--space-3) var(--space-2)}

.mtile .ph::after{content:"";position:absolute;inset:0;z-index:2;border-radius:inherit;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--text) 10%,transparent);transition:box-shadow var(--dur-fast)}
.mtile:hover:not(:disabled) .ph::after{box-shadow:inset 0 0 0 2px var(--border-hover)}
.mtile.is-current .ph::after{box-shadow:inset 0 0 0 2px var(--select),inset 0 0 0 4px var(--surface)}
.mtile:focus-visible{outline:none}
.mtile:focus-visible .ph::after{box-shadow:inset 0 0 0 2px var(--focus),inset 0 0 0 4px var(--surface)}
.mtile:disabled{cursor:default}
.mtile .nm{font-size:var(--text-xs);font-weight:var(--weight-medium);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mtile .mt{margin-top:-2px;font-size:var(--text-2xs);color:var(--text-subtle);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mtile .mt.new{color:var(--status-live);font-weight:var(--weight-semibold)}
.mtile .mt.danger{color:var(--status-danger);font-weight:var(--weight-semibold)}
.mtile .pcheck{position:absolute;right:5px;top:5px;z-index:3;display:grid;place-items:center;width:18px;height:18px;border-radius:50%;background:var(--select);color:var(--on-fill);box-shadow:0 0 0 2px var(--surface)}
.mtile .mbar{position:absolute;left:6px;right:6px;bottom:6px;z-index:1}
.mtile .pbadge{right:4px;bottom:4px}
.mtile .pbadge.busy{left:4px;right:auto;bottom:auto;top:4px}
/* A clip that failed: across the grid, with a sentence a designer can act on */
.mfail{grid-column:1/-1;display:grid;grid-template-columns:auto minmax(0,1fr);gap:var(--space-2-5);align-items:start;padding:var(--space-1-5);border:1px solid var(--status-danger-border);border-radius:var(--radius-md);background:var(--status-danger-wash);font-size:var(--text-sm);color:var(--status-danger)}
.mfail .ph{width:calc(var(--thumb-h) * 16 / 9);height:var(--thumb-h);border-radius:var(--radius-sm);background:var(--surface)}
.mfail b{display:block;color:var(--status-danger-strong);font-weight:var(--weight-semibold);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mfail p{margin-top:2px;font-size:var(--text-xs);line-height:1.45}
/* Files the library refused, each with its sentence (a refused create: red, as M5a's address taken) */
.refused{display:flex;flex-direction:column;gap:var(--space-1);margin-bottom:var(--space-3)}
.refused .note{margin:0;padding:var(--space-2) var(--space-2) var(--space-2) var(--space-2-5)}
.refused .note b{font:var(--weight-semibold) var(--text-sm)/1.35 var(--font-mono);overflow-wrap:anywhere}
.refused .note .ib{width:24px;height:24px;margin:-2px -2px 0 0}
.refused .note.has-x{grid-template-columns:16px minmax(0,1fr) auto}
/* An image's own level: the picture, its facts, where it's used, the alt text already used for it */
.mdetail{display:grid;place-items:center;padding:var(--space-2);border:1px solid var(--border);border-radius:var(--radius-md);background:var(--surface-sunken)}
.mdetail .ph{width:min(100%,calc(var(--focal-max-h) * var(--r,1.5)));aspect-ratio:var(--r,1.5);border-radius:var(--radius-xs)}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:var(--space-1) var(--space-3);margin:var(--space-3) 0 var(--space-1);font-size:var(--text-sm)}
.kv dt{color:var(--text-muted)}
.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.kv dd .mono{font-size:var(--text-xs);color:var(--text-muted)}
.uses .drow{min-height:34px}
.uses .drow .meta{max-width:50%;overflow:hidden;text-overflow:ellipsis}
.alt-used{padding:var(--space-2) var(--space-2-5);border-radius:var(--radius-md);background:var(--surface-sunken);font-size:var(--text-sm)}
.alt-used q{display:block;color:var(--text);quotes:"“" "”"}
.alt-used small{display:block;margin-top:var(--space-1);font-size:var(--text-xs);color:var(--text-subtle)}
.field-err{display:flex;align-items:flex-start;gap:var(--space-1-5);margin-top:var(--space-1-5);font-size:var(--text-sm);color:var(--status-danger);font-weight:var(--weight-medium)}
.field-err .i{margin-top:2px}
/* Rich text, the one `richText` field (M5a): paragraphs, bold, italic, links, lists, line breaks; H2/H3 only when
   the block's author switched headings on. Never an H1, no slash menu. Enter: new paragraph (in a list, a new item);
   Shift+Enter: a line break inside the paragraph, heading or item. */
.prose-wrap{position:relative;border:1px solid var(--border-strong);border-radius:var(--radius-md);background:var(--surface);transition:border-color var(--dur-fast),box-shadow var(--dur-fast)}
.prose-wrap:focus-within{border-color:var(--select);box-shadow:0 0 0 3px var(--select-halo)}
.tb{position:relative;display:flex;align-items:center;gap:2px;padding:3px;border-bottom:1px solid var(--border)}
.tb>button{display:inline-grid;place-items:center;width:26px;height:24px;padding:0;border:0;border-radius:var(--radius-sm);background:none;color:var(--text-muted);font-size:var(--text-sm);font-weight:var(--weight-semibold)}
.tb>button:hover:not(:disabled){background:var(--surface-hover);color:var(--text)}
.tb>button[aria-pressed="true"],.tb>button[aria-expanded="true"]{background:var(--surface-pressed);color:var(--text)}
.tb>.tb-style{display:inline-flex;gap:var(--space-1);width:auto;padding:0 var(--space-1-5) 0 var(--space-2);color:var(--text);font-weight:var(--weight-medium)}
.tb .sep{width:1px;height:16px;margin:0 var(--space-1);background:var(--border)}
.tb .menu{left:2px;top:calc(100% + 2px);min-width:180px}
.tb .menu .st-p{font-size:var(--text-base)}
.tb .menu .st-h2{font-size:var(--text-lg);font-weight:var(--weight-semibold);letter-spacing:var(--tracking-tight)}
.tb .menu .st-h3{font-size:var(--text-md);font-weight:var(--weight-semibold)}
.tb .menu button[aria-checked="true"]{background:var(--select-wash);color:var(--select-strong)}
.prose{min-height:70px;padding:8px 10px;outline:0;line-height:var(--leading-loose)}
.prose p+p{margin-top:8px}
.rt{min-height:120px}
.rt>*+*{margin-top:var(--space-2)}
.rt h2,.rt h3{margin:var(--space-3) 0 0;font-weight:var(--weight-semibold);line-height:var(--leading-tight);letter-spacing:var(--tracking-tight)}
.rt>h2:first-child,.rt>h3:first-child{margin-top:0}
.rt h2{font-size:var(--text-lg)}
.rt h3{font-size:var(--text-md)}
.rt ul,.rt ol{margin-bottom:0;padding-left:var(--space-5)}
.rt li+li{margin-top:var(--space-0-5)}
.rt a{color:var(--select-strong);text-decoration:underline;text-decoration-color:color-mix(in srgb,currentColor 45%,transparent);text-underline-offset:2px}
.rt .rt-sel{background:var(--select-halo);border-radius:2px;box-shadow:0 0 0 1px var(--select-halo)}
.rt .is-caret{background:var(--surface-sunken);border-radius:var(--radius-xs);box-shadow:0 0 0 4px var(--surface-sunken)}
.rt-keys{display:flex;flex-wrap:wrap;align-items:center;gap:var(--space-1);margin-top:var(--space-1-5);font-size:var(--text-xs);color:var(--text-subtle)}
/* Field messages that never block anything (amber), beside .field-err, which is for what does (red, Decision 12) */
.field-warn{display:flex;align-items:flex-start;gap:var(--space-1-5);margin-top:var(--space-1-5);font-size:var(--text-sm);color:var(--status-warning);font-weight:var(--weight-medium)}
.field-warn .i{margin-top:2px;color:var(--status-warning-dot)}
.field-warn.quiet{font-weight:var(--weight-regular);color:var(--text-muted)}
/* "Applies straight away": the opposite of "applies once it's published" (clock); a bolt in live green */
.field-hint.now .i{color:var(--status-live)}
/* Repeatable list (M5a): repeatable groups of fields. A collapsed item shows a one-line summary; one opens at a time.
   Add, remove (with Undo), reorder by drag and ⌥↑/⌥↓, as blocks are. No lists inside lists. */
.items{display:flex;flex-direction:column;gap:var(--space-1)}
.item{position:relative;border:1px solid var(--border);border-radius:var(--radius-md);background:var(--surface);transition:border-color var(--dur-fast),box-shadow var(--dur-fast)}
.item:hover{border-color:var(--border-hover)}
.item.is-open{border-color:var(--border-strong);box-shadow:var(--shadow-control)}
.item.is-warn{background:var(--status-warning-wash);border-color:var(--status-warning-border)}
.item-h{display:flex;align-items:center;gap:var(--space-0-5);min-height:32px;padding:0 var(--space-0-5) 0 var(--space-1)}
.item-h .grip{display:inline-flex;opacity:1}
.item-sum{flex:1;min-width:0;display:flex;align-items:center;gap:var(--space-1-5);height:30px;padding:0 var(--space-1);border:0;border-radius:var(--radius-sm);background:none;text-align:left;font-size:var(--text-base);white-space:nowrap}
.item-sum:focus-visible{outline-offset:-2px}
.item-sum .s{min-width:0;overflow:hidden;text-overflow:ellipsis}
.item-sum .s span{color:var(--text-muted)}
.item-sum .s em{font-style:normal;color:var(--text-subtle)}
.item-sum .wmark{flex:none}
.item-sum>.i:last-child{margin-left:auto;color:var(--icon);transition:rotate var(--dur-fast) var(--ease-out)}
.item.is-open .item-sum>.i:last-child{rotate:90deg}
.item .ib{width:26px;height:26px}
.item-b{padding:0 var(--space-2-5) var(--space-2-5) 28px}
.item-b .sub-label:first-child{margin-top:var(--space-0-5)}
.item .menu{right:2px;top:30px}
.list-foot{display:flex;align-items:center;justify-content:space-between;gap:var(--space-2);margin-top:var(--space-2)}
.list-empty{padding:var(--space-2-5) var(--space-3);border:1px dashed var(--border-strong);border-radius:var(--radius-md);font-size:var(--text-sm);color:var(--text-muted)}
/* M7: a list inside a list, one level (Decisions 14–15). The inner list sits inside its open outer row, on a sunken wash
   with its own label, count, Add and drag hint. Its rows are the same rows. Nesting reads from the inset and the wash,
   never a side rail. */
.sublist{margin-top:var(--space-2-5);padding:var(--space-2) var(--space-2) var(--space-1-5);border-radius:var(--radius-md);background:var(--surface-sunken)}
.sublist-h{display:flex;align-items:baseline;gap:var(--space-2);margin:0 var(--space-0-5) var(--space-1-5)}
.sublist-h .sub-label{margin:0}
.sublist-h .field-meta{margin-left:auto}
.sublist .item-b{padding-left:26px}
.sublist .list-foot{margin-top:var(--space-1-5);padding:0 var(--space-0-5)}
.sublist .list-empty{background:var(--surface);padding:var(--space-2) var(--space-2-5)}
.item-b .field-help.sub{margin:var(--space-1) 0 0}
details.fgroup.site-group{margin-top:var(--space-2);margin-bottom:var(--space-3)}
details.fgroup.site-group>.in .sub-label:first-child{margin-top:0}
details.fgroup.site-group>summary{white-space:nowrap}
details.fgroup.site-group>summary .s{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
/* Reference (M5a): picks a document from another collection. A list of them reorders like any list. */
.refs{display:flex;flex-direction:column;gap:var(--space-1)}
.ref{position:relative;display:flex;align-items:center;gap:var(--space-2);min-height:42px;padding:var(--space-1) var(--space-0-5) var(--space-1) var(--space-1);border:1px solid var(--border);border-radius:var(--radius-md);background:var(--surface)}
.ref:hover{border-color:var(--border-hover)}
.ref .grip{display:inline-flex;opacity:1}
.ref>.i{color:var(--icon)}
.ref .t{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.3}
.ref .t b{font-weight:var(--weight-medium);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ref .t small{font:var(--text-xs)/1.35 var(--font-mono);color:var(--text-subtle);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ref .yr{font-size:var(--text-xs);color:var(--text-subtle);font-variant-numeric:tabular-nums}
.ref .ib{width:26px;height:26px}
.ref.is-missing{background:var(--status-warning-wash);border-color:var(--status-warning-border)}
.ref.is-missing>.i{color:var(--status-warning-dot)}
.ref.is-missing .t b{color:var(--status-warning-strong)}
.ref.is-missing .t small{color:var(--status-warning)}
/* Pickers that drop from a field: documents for a link or a reference */
.lpop{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:6;padding:var(--space-1);background:var(--surface);border-radius:var(--radius-lg);box-shadow:var(--shadow-pop);animation:pop-in var(--dur-base) var(--ease-out)}
.lpop .find{margin:0 0 var(--space-1)}
.lpop .find .input{min-height:30px}
.lpop .sw-h{padding:var(--space-1-5) var(--space-2) var(--space-1)}
.lpop .drow{min-height:32px}
.lpop .drow .meta .mono{font-size:var(--text-2xs)}
.lpop .drow.is-active{background:var(--surface-hover)}
.lpop .drow:disabled{cursor:default;background:none;color:var(--text-subtle)}
.lpop .drow:disabled .i{color:var(--border-hover)}
.lpop-foot{margin-top:var(--space-1);padding:var(--space-2) var(--space-2) var(--space-1);border-top:1px solid var(--border);font-size:var(--text-xs);color:var(--text-subtle);line-height:1.5}
.lpop-foot .mono{color:var(--text-muted)}
/* Link (M5a): a label and where it goes — a document picked from the site, or a typed /path, https://, mailto:, tel: or #anchor */
.lnk{position:relative}
.lnk-box{display:flex;align-items:center;gap:var(--space-1-5);min-height:var(--control-h);padding:0 var(--space-0-5) 0 var(--space-2-5);border:1px solid var(--border-strong);border-radius:var(--radius-md);background:var(--surface);transition:border-color var(--dur-fast),box-shadow var(--dur-fast)}
.lnk-box:hover{border-color:var(--border-hover)}
.lnk-box:focus-within{border-color:var(--select);box-shadow:0 0 0 3px var(--select-halo)}
.lnk-box>.i,.lnk-glyph{flex:none;color:var(--icon)}
.lnk-glyph{width:16px;text-align:center;font:var(--weight-semibold) var(--text-sm)/1 var(--font-mono)}
.lnk-box input{flex:1;min-width:0;height:30px;padding:0;border:0;outline:0;background:none}
.lnk-box input::placeholder{color:var(--text-subtle)}
.lnk-box .ib{width:26px;height:26px}
.lnk-doc{flex:1;min-width:0;display:flex;align-items:baseline;gap:var(--space-1-5);white-space:nowrap;overflow:hidden}
.lnk-doc b{font-weight:var(--weight-medium)}
.lnk-doc .mono{font-size:var(--text-xs);color:var(--text-subtle);overflow:hidden;text-overflow:ellipsis}
.lnk.is-missing .lnk-box{background:var(--status-warning-wash);border-color:var(--status-warning-border)}
.lnk.is-missing .lnk-box>.i{color:var(--status-warning-dot)}
.lnk.is-missing .lnk-doc b{color:var(--status-warning-strong)}
.lnk.is-missing .lnk-doc span{color:var(--status-warning)}
.lnk.is-bad .lnk-box{border-color:var(--status-warning-dot)}
/* Buttons (M5a): up to two, each a label, a link and one of the site's styles */
.btnf{padding:var(--space-2) var(--space-2-5) var(--space-2-5);border:1px solid var(--border);border-radius:var(--radius-md);background:var(--surface-sunken)}
.btnf+.btnf{margin-top:var(--space-1-5)}
.btnf.is-half{border-color:var(--status-warning-border)}
.btnf-h{display:flex;align-items:center;gap:var(--space-2);margin-bottom:var(--space-1-5)}
.btnf-h .t{font-size:var(--text-xs);font-weight:var(--weight-semibold);color:var(--text-muted)}
.btnf-h .ib{width:24px;height:24px}
.btnf .mini-seg{margin:0 0 0 auto}
.btnf .mini-seg button{flex:none;height:22px;padding:0 var(--space-2);font-size:var(--text-xs)}
.btnf>.input{margin-bottom:var(--space-1-5)}
/* Number: an optional min and max */
.numf{display:flex;align-items:center;gap:var(--space-2)}
.numf .input{width:96px}
.numf .rng{font-size:var(--text-xs);color:var(--text-subtle)}
.numf .input[aria-invalid="true"]{border-color:var(--status-warning-dot);box-shadow:0 0 0 3px var(--status-warning-wash)}
/* Date: a day, shown in the site's format (Europe/Dublin); weeks start on Monday */
.datef{position:relative}
.datef .lnk-box{padding-left:var(--space-2-5)}
.cal{position:absolute;left:0;top:calc(100% + 4px);z-index:6;width:252px;padding:var(--space-3);background:var(--surface);border-radius:var(--radius-lg);box-shadow:var(--shadow-pop);animation:pop-in var(--dur-base) var(--ease-out)}
.cal-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:var(--space-1);font-weight:var(--weight-semibold)}
.cal-h .ib{width:26px;height:26px}
.cal-g{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.cal-g .wd{padding:var(--space-1) 0;font-size:var(--text-2xs);font-weight:var(--weight-semibold);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--text-subtle)}
.cal-g button{height:30px;padding:0;border:0;border-radius:var(--radius-sm);background:none;font-size:var(--text-sm);font-variant-numeric:tabular-nums}
.cal-g button:hover{background:var(--surface-hover)}
.cal-g button.out{color:var(--text-subtle)}
.cal-g button[aria-pressed="true"]{background:var(--select);color:var(--on-fill);font-weight:var(--weight-semibold)}
.cal-f{display:flex;align-items:center;justify-content:space-between;margin-top:var(--space-2);padding-top:var(--space-2);border-top:1px solid var(--border)}
.linkbtn{display:inline-flex;align-items:center;gap:var(--space-1);padding:0;border:0;background:none;color:var(--select-strong);font-weight:var(--weight-medium);text-decoration:underline;text-decoration-color:color-mix(in srgb,currentColor 40%,transparent);text-underline-offset:3px}
.linkbtn:hover{text-decoration-color:currentColor}
.linkbtn.subtle{color:var(--text-muted);text-decoration:none}
.linkbtn.subtle:hover{color:var(--text)}
.linkbtn:disabled{color:var(--text-subtle);cursor:not-allowed;text-decoration:none}
details.fgroup{margin:0 calc(-1 * var(--space-4));border-top:1px solid var(--border)}
details.fgroup:last-of-type{border-bottom:1px solid var(--border)}
details.fgroup>summary{display:flex;align-items:center;gap:var(--space-2);height:40px;padding:0 var(--space-4);cursor:pointer;list-style:none;font-size:var(--text-sm);font-weight:var(--weight-semibold);color:var(--text-muted)}
details.fgroup>summary::-webkit-details-marker{display:none}
details.fgroup>summary .s{font-weight:var(--weight-regular);color:var(--text-subtle)}
details.fgroup>summary .i{margin-left:auto;transition:rotate var(--dur-fast)}
details.fgroup[open]>summary .i{rotate:90deg}
details.fgroup>.in{padding:0 var(--space-4) var(--space-2)}
/* Mockup annotation, not part of the design: a place a later milestone builds (same purple dashes as the review panel) */
.mk-later{display:inline-flex;align-items:center;height:18px;padding:0 6px;border:1px dashed #a855f7;border-radius:var(--radius-xs);background:#faf5ff;color:#6b21a8;font:500 10.5px/1 var(--font-mono);letter-spacing:0;text-transform:none}
details.fgroup.is-later>summary{color:var(--text-subtle)}

/* The lockup field: one input row per line; Main lines / Phone lines (Spec → Text) */
.lk-rows{display:flex;flex-direction:column;gap:var(--space-1)}
.lk-row{display:flex;align-items:center;gap:var(--space-1-5);height:var(--control-h);padding:0 var(--space-2) 0 var(--space-1-5);border:1px solid var(--border-strong);border-radius:var(--radius-md);background:var(--surface);transition:border-color var(--dur-fast),box-shadow var(--dur-fast)}
.lk-row:focus-within{border-color:var(--select);box-shadow:0 0 0 3px var(--select-halo)}
.lk-row .n{width:14px;flex:none;text-align:right;font:var(--text-2xs)/1 var(--font-mono);color:var(--text-subtle)}
.lk-row input{flex:1;min-width:0;height:100%;padding:0;border:0;outline:0;background:none;font-size:var(--text-base)}
.lk-field.phone .lk-row{border-color:var(--phone-border);background:var(--phone-field)}
.lk-field.phone .lk-row:focus-within{border-color:var(--phone);box-shadow:0 0 0 3px var(--phone-halo)}
.lk-field.phone .lk-row .n{color:var(--phone-strong)}
.lk-under{display:flex;align-items:center;justify-content:space-between;gap:var(--space-2);margin-top:var(--space-1-5);font-size:var(--text-xs);color:var(--text-subtle)}
.lk-under.phone{justify-content:flex-start;color:var(--phone-strong)}
.lk-under.phone.nudge{animation:nudge var(--dur-slow) var(--ease-in-out)}
@keyframes nudge{30%{translate:3px 0}60%{translate:-3px 0}}
.lk-status{margin-top:var(--space-2)}
.lk-status:empty{display:none}
.lk-ok{display:flex;align-items:center;gap:var(--space-1);font-size:var(--text-xs);color:var(--status-live);font-weight:var(--weight-medium)}
.mini-seg{display:flex;gap:2px;margin-bottom:var(--space-2);padding:2px;border-radius:var(--radius-md);background:var(--surface-pressed)}
.mini-seg button{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:var(--space-1);height:26px;border:0;border-radius:var(--radius-sm);background:none;color:var(--text-muted);font-size:var(--text-sm);font-weight:var(--weight-medium)}
.mini-seg button[aria-checked="true"]{background:var(--surface);color:var(--text);font-weight:var(--weight-semibold);box-shadow:var(--shadow-raised)}
.mini-seg button[aria-checked="true"].ph{color:var(--phone-strong)}
.mini-seg .none{font-weight:var(--weight-regular);color:var(--text-subtle)}

/* ── M6: Search and sharing, and Site Settings' publish-time fields. A soft limit is amber and blocks nothing ── */

.input.mono{font-family:var(--font-mono);font-size:var(--text-sm)}

.gtag .field-warn .linkbtn{margin-top:var(--space-1);font-family:var(--font-mono)}

/* ── The one bar, dark, along the bottom (4d) ── */
.bar{grid-row:2;grid-column:1/-1;display:grid;grid-template-columns:var(--sidebar-w) minmax(0,1fr);background:var(--bar-bg);color:var(--bar-text);border-top:1px solid var(--bar-border);z-index:var(--z-bar);font-size:var(--text-base);--ring:var(--bar-bg)}

.docbtn .i{color:var(--bar-muted)}

.side-toggle{flex:none;margin-left:auto;color:var(--bar-muted)}
.side-toggle:hover{background:var(--bar-raised);color:var(--bar-text)}
.bar-r{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(max-content,1fr);align-items:center;gap:var(--space-3);min-width:0;padding:0 var(--space-3)}
.bar-a{display:flex;justify-content:flex-end;min-width:0;overflow:hidden}
.bar-c{display:flex;align-items:center;gap:var(--space-2)}

.bar-note{display:inline-flex;align-items:center;gap:var(--space-1-5);color:var(--bar-muted);font-size:var(--text-sm);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-warn{display:inline-flex;align-items:center;gap:var(--space-1-5);height:26px;padding:0 var(--space-2-5);border:1px solid var(--status-warning-dark-border);border-radius:var(--radius-pill);background:var(--status-warning-dark-wash);color:var(--status-warning-on-dark);font-size:var(--text-sm);font-weight:var(--weight-semibold);white-space:nowrap}
.seg{display:inline-flex;gap:2px;padding:2px;border-radius:var(--radius-md);background:var(--bar-raised)}

.wdot{width:7px;height:7px;border-radius:50%;background:var(--status-warning-dot);box-shadow:0 0 0 2px var(--bar-raised)}

.tip{position:absolute;bottom:calc(100% + 12px);left:50%;translate:-50% 4px;padding:6px 10px;border-radius:var(--radius-md);background:var(--tooltip-bg);border:1px solid var(--bar-border);box-shadow:var(--shadow-pop);color:var(--bar-text);font-size:var(--text-sm);font-weight:var(--weight-medium);white-space:nowrap;opacity:0;pointer-events:none;transition:opacity var(--dur-fast),translate var(--dur-fast) var(--ease-out)}

.me{display:inline-grid;place-items:center;width:30px;height:30px;padding:0;border:0;border-radius:50%;background:none}

@media (prefers-reduced-motion:reduce){.keep .pulse,.pub .prog::after{animation:none}}

/* ── Popovers (they open upward from the bar) ── */
.pop{position:absolute;bottom:calc(var(--bar-h) + var(--pop-gap));z-index:var(--z-pop);display:flex;flex-direction:column;max-height:calc(100% - var(--bar-h) - 24px);background:var(--surface);color:var(--text);border-radius:var(--radius-xl);box-shadow:var(--shadow-pop);animation:pop-in var(--dur-base) var(--ease-out)}

/* M5b: each image without alt text in a waiting document, named by its slot, with Add alt text */
.alt-rows{display:flex;flex-direction:column;gap:var(--space-1);margin-top:var(--space-2)}
.alt-row{display:flex;align-items:center;gap:var(--space-2);min-height:var(--control-h-sm)}

.hist{width:100%;border-collapse:collapse;font-size:var(--text-sm)}

.sw-in{position:relative;padding:var(--space-3) var(--space-3) var(--space-2)}

.sw-list{flex:1;min-height:0;overflow:auto;padding:0 var(--space-2) var(--space-2)}
.sw-h{padding:var(--space-2) var(--space-2) var(--space-1);font-size:var(--text-xs);font-weight:var(--weight-semibold);letter-spacing:var(--tracking-caps);text-transform:uppercase;color:var(--text-muted)}

.acct{padding:var(--space-4)}
.acct .who{display:flex;align-items:center;gap:var(--space-3)}

.toast{position:absolute;left:var(--space-3);bottom:calc(var(--bar-h) + var(--space-3));z-index:var(--z-toast);display:flex;align-items:center;gap:var(--space-2);width:calc(var(--sidebar-w) - 2 * var(--space-3));min-height:40px;padding:var(--space-1-5) var(--space-1-5) var(--space-1-5) var(--space-3);background:var(--bar-bg);color:var(--bar-text);border-radius:var(--radius-lg);box-shadow:var(--shadow-pop);font-size:var(--text-sm);animation:pop-in var(--dur-base) var(--ease-out)}

/* ── Full-screen screens: sign-in (works to 320 wide) and the too-narrow note ── */
.screen{position:absolute;inset:0;z-index:var(--z-screen);display:none;overflow:auto;background:var(--surface-sunken)}

}

.nw p{color:var(--text-muted);font-size:var(--text-md)}
.nw p+p{margin-top:var(--space-3)}
.nw .addr{display:flex;align-items:center;justify-content:space-between;gap:var(--space-2);margin-top:var(--space-5);padding:var(--space-2) var(--space-2) var(--space-2) var(--space-3);border:1px solid var(--border-strong);border-radius:var(--radius-md);background:var(--surface);font-family:var(--font-mono);font-size:var(--text-sm);overflow-wrap:anywhere}
.nw .ok{display:flex;align-items:center;gap:var(--space-2);margin-bottom:var(--space-5);padding:var(--space-2) var(--space-3);border:1px solid var(--status-live-border);border-radius:var(--radius-md);background:var(--status-live-wash);color:var(--status-live);font-size:var(--text-sm);font-weight:var(--weight-medium);overflow-wrap:anywhere}
.nw .fine{margin-top:var(--space-6);font-size:var(--text-sm)}

/* ══ Mockup review panel (not part of the design) ══ */
.mk{position:fixed;top:10px;right:10px;z-index:10000;color:#3b0764;font:500 11.5px/1.4 var(--font-mono);--mk-bg:#faf5ff;--mk-line:#a855f7}
.mk button,.mk select{font:inherit;color:inherit}
.mk-tab{display:flex;align-items:center;gap:4px;padding:4px;background:var(--mk-bg);border:1px dashed var(--mk-line);border-radius:10px;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.mk-tab .lbl{max-width:min(260px,calc(100vw - 150px));padding:0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mk-tab .lbl b{font-weight:700}
.mk-b{height:24px;min-width:24px;padding:0 7px;border:1px solid #d8b4fe;border-radius:6px;background:#fff;cursor:pointer;white-space:nowrap}
.mk-b:hover{background:#f3e8ff}
.mk-b.on{background:#7e22ce;border-color:#7e22ce;color:#fff}
.mk-b:disabled{opacity:.45;cursor:not-allowed}
.mk-panel{width:360px;max-height:calc(100vh - 64px);margin-top:6px;overflow:auto;padding:12px;background:var(--mk-bg);border:1px dashed var(--mk-line);border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.28)}
.mk-panel h4{margin:12px 0 6px;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:#7e22ce}
.mk-panel h4:first-child{margin-top:0}
.mk-row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.mk-row label{display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.mk-sw{width:14px;height:14px;border-radius:4px;border:1px solid rgba(0,0,0,.2);display:inline-block}
.mk-g{margin:10px 0 4px;display:flex;justify-content:space-between;gap:6px;font-weight:700}
.mk-g span{font-weight:500;color:#7e22ce}
.mk-list{display:flex;flex-direction:column;gap:1px}
.mk-s{display:flex;gap:6px;width:100%;padding:3px 6px;border:0;border-radius:5px;background:none;text-align:left;cursor:pointer}
.mk-s:hover{background:#f3e8ff}
.mk-s.on{background:#7e22ce;color:#fff}
.mk-s .n{width:20px;flex:none;opacity:.6;text-align:right}
.mk-note{margin-top:6px;color:#581c87;font-size:11px;line-height:1.45}
.mk details{margin-top:10px;border-top:1px dashed #d8b4fe;padding-top:8px}
.mk summary{cursor:pointer;font-weight:700}
.mk details ul{margin:6px 0 0;padding-left:16px}
.mk details li{margin:3px 0}
.mk kbd{border-color:#d8b4fe;color:#581c87}
.mk-tab .lbl{max-width:min(260px,calc(100vw - 280px))}
/* The review panel's Brand presets strip: each card sets one preset's brand slots and draws the real pieces on them */
.mk-pre-list{display:flex;flex-direction:column;gap:6px}
.mk-pre{display:flex;flex-direction:column;gap:7px;width:100%;padding:8px;border:1px solid #e9d5ff;border-radius:8px;background:#fff;text-align:left;cursor:pointer}
.mk-pre:hover{border-color:#c084fc}
.mk-pre.on{border-color:#7e22ce;box-shadow:0 0 0 1px #7e22ce}
.mk-pre-h{display:flex;align-items:baseline;gap:6px}
.mk-pre-h b{font-weight:700}
.mk-pre-h .d{margin-left:auto;color:#7e22ce}
.mk-pre-s{display:flex;flex-wrap:wrap;align-items:center;gap:8px;font-family:var(--font-ui);pointer-events:none}
.mk-pre-s .accent-try{flex-basis:100%;margin-top:0}
.mk-pre-r{color:#581c87;font-size:10.5px;line-height:1.5}
.mk-pre-r .bad{color:#b42318;font-weight:700}
.mk-out{display:inline-block;width:10px;height:10px;margin-right:3px;border-radius:3px;vertical-align:-1px}
/* The editor's own .logo-mono (editor.css: a site with no logo gets its initial on the accent), which M2's mockup never
   drew. Unchanged by the restyle; here so the strip can show the logo tile the accent paints. */
.logo-mono{display:grid;place-items:center;width:100%;height:100%;border-radius:var(--radius-sm);background:var(--accent);color:var(--accent-ink);box-shadow:inset 0 0 0 1px var(--accent-edge);font:var(--weight-bold) var(--text-sm)/1 var(--font-ui)}
.mk-nu{display:inline-block;margin-left:auto;padding:0 5px;border-radius:4px;font-size:10px;line-height:16px;white-space:nowrap}
.mk-nu.danger{background:#fde4df;color:#8a1a12}.mk-nu.warn{background:#fdecc8;color:#6b3a06}.mk-nu.calm{background:#ece9f7;color:#4c3b8f}
.mk-s.on .mk-nu{background:#fff}
.mk-quick{display:flex;flex-wrap:wrap;gap:4px}
.mk-quick .mk-b{height:22px;padding:0 6px;font-size:11px}
.mk-quick .mk-b.danger{border-color:#f0b4a9}.mk-quick .mk-b.warn{border-color:#ebc77f}.mk-quick .mk-b.calm{border-color:#cbbff0}
/* ══════════════════════════════════════════════════════════════════════════
   THE RESTYLE: the consoles' "soft brutal" look on the editor (the editor restyle;
   the look: the consoles' design system, Decisions 1–3).
   Warm and chunky at rest, loud only where something needs you. The pressed buttons, the frames and the dark bar,
   on the tokens in :root above; the editor's copies are in editor.css and styles/levels/*.css. Decision 12: the brand
   also fills every .btn.ink and the on switch, and Site Settings' accent is a radio group of preset swatches (.presets).
   Selection, focus, the overlays, status colours, danger, the bar and stage, and Publish's green don't take it.
   ══════════════════════════════════════════════════════════════════════════ */

/* ── Buttons: the pressed look. A 2px darker bottom edge the button sinks into on :active; quiet buttons have no
   edge and take a pressed wash instead; disabled has no edge. Instant under reduced motion (--dur-fast is 0). ── */
.btn{transition:background var(--dur-fast),border-color var(--dur-fast),filter var(--dur-fast),translate var(--dur-fast),box-shadow var(--dur-fast)}
.btn:active:not(:disabled){translate:0 var(--press-depth);box-shadow:0 0 0 var(--edge-secondary)}
/* The main buttons wear the brand (Decision 12): every .btn.ink (Create, Move, Apply, Done, Try again, Sign in again…)
   takes .btn.accent's slots: --accent fill, --accent-ink label, --accent-edge border, --edge-accent pressed edge, and the
   same hover. The class stays .btn.ink. Disabled stays the plain disabled button, as M2 has it. */
.btn.ink{background:var(--accent);border-color:var(--accent-edge);color:var(--accent-ink);box-shadow:0 var(--press-depth) 0 var(--edge-accent)}
.btn.ink:hover:not(:disabled){background:var(--accent);border-color:var(--accent-edge);filter:brightness(.93)}
.btn.ink:active:not(:disabled){box-shadow:0 0 0 var(--edge-accent)}
.btn.ink:disabled{background:var(--surface-sunken);border-color:var(--border);color:var(--text-subtle);box-shadow:none;filter:none}
.btn.accent{box-shadow:0 var(--press-depth) 0 var(--edge-accent)}
.btn.accent:active:not(:disabled){box-shadow:0 0 0 var(--edge-accent)}
.btn.danger:not(:disabled),.btn.danger:hover:not(:disabled){border-color:var(--edge-danger)}
.btn.danger{box-shadow:0 var(--press-depth) 0 var(--edge-danger)}
.btn.danger:active:not(:disabled){box-shadow:0 0 0 var(--edge-danger)}
.btn.phone:not(:disabled),.btn.phone:hover:not(:disabled){border-color:var(--edge-phone)}
.btn.phone{box-shadow:0 var(--press-depth) 0 var(--edge-phone)}
.btn.phone:active:not(:disabled){box-shadow:0 0 0 var(--edge-phone)}
/* Publish is green, not the brand: the final "Publish N changes" (.btn.publish) and the count on the bar's Publish. The
   accent fills the main buttons (.btn.ink, above), the on switch, the logo tile and sign-in's main button (Decision 12). */
.btn.publish{background:var(--publish);border-color:var(--publish-edge);color:var(--publish-ink);box-shadow:0 var(--press-depth) 0 var(--publish-edge)}
.btn.publish:hover:not(:disabled){background:var(--publish-hover);border-color:var(--publish-edge);filter:none}
.btn.publish:active:not(:disabled){box-shadow:0 0 0 var(--publish-edge)}
.btn.publish:disabled{background:var(--surface-sunken);border-color:var(--border);color:var(--text-subtle);box-shadow:none;filter:none}
.count{background:var(--publish);color:var(--publish-ink);box-shadow:0 0 0 1px var(--publish-edge)}
.btn.ghost{box-shadow:none}
.btn.ghost:active:not(:disabled){translate:none;background:var(--surface-pressed);box-shadow:none}
.btn:disabled{border-color:var(--border);box-shadow:none;translate:none}
/* A toggle whose part is open stays down (Replace's menu, the focal point, a clip's frame) */
.media-acts .btn[aria-expanded="true"]{translate:0 var(--press-depth);box-shadow:0 0 0 var(--edge-secondary)}
.ib{transition:background var(--dur-fast),color var(--dur-fast),translate var(--dur-fast),box-shadow var(--dur-fast)}
.ib:active:not(:disabled){background:var(--surface-pressed);color:var(--text)}
.ib.boxed{box-shadow:var(--shadow-control)}
.ib.boxed:active:not(:disabled){translate:0 var(--press-depth);box-shadow:0 0 0 var(--edge-secondary)}
/* Quiet controls: no edge, a pressed wash */
.drow:active:not(:disabled),.menu button:active:not(:disabled),.tb>button:active:not(:disabled),.cal-g button:active:not([aria-pressed="true"]),
.twisty:active,.add-row:active:not(:disabled),.rchip:active,.item-sum:active,.lv:active,.mini-seg button:active:not([aria-checked="true"]),
.linkbtn.subtle:active,.ptype:active,.srow:active,.frow:active{background:var(--surface-pressed)}
.add-row:active:not(:disabled){color:var(--select-strong)}
kbd{border-bottom-color:var(--border-strong)}

/* ── Site Settings' accent sample (spec Decision 11): with Publish green, it previews what the accent does fill, the
   logo tile and a sign-in-style button on the accent, on the light Site Settings surface, not the dark bar strip.
   The button is sign-in's main button (.btn.accent: the accent fill, --accent-edge border, --edge-accent pressed edge);
   a span, since the sample is aria-hidden and does nothing. ── */
.accent-try{padding:var(--space-2) var(--space-2-5) calc(var(--space-2) + var(--press-depth));border:1px solid var(--border);background:var(--surface-sunken);color:var(--text-muted);font-size:var(--text-sm)}
.accent-try .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.accent-try .btn{flex:none;margin-left:auto;pointer-events:none}

/* ── Site Settings' accent picker (Decision 12): presets only, a radio group of swatches (arrows move and pick). Each
   swatch is its colour with brand.ts's border for it (darker only if pale), set inline as --sw, --sw-edge, --sw-ink.
   The chosen one is ringed (a 2px gap of surface, then a 2px ink ring) and carries a check in its label colour; focus
   is the tool's blue ring, outside that. A stored colour that isn't a preset comes first as "Current", set apart by a
   hairline. The chosen name and hex sit in the field head. ── */
.presets{display:flex;flex-wrap:wrap;align-items:center;gap:var(--space-2);padding:var(--space-1)}
.preset{display:grid;place-items:center;width:var(--swatch-size);height:var(--swatch-size);flex:none;padding:0;border:1px solid var(--sw-edge);border-radius:var(--radius-md);background:var(--sw);color:var(--sw-ink);cursor:pointer;transition:box-shadow var(--dur-fast)}
.preset .i{opacity:0}
.preset:hover{box-shadow:0 0 0 2px var(--surface),0 0 0 3px var(--border-hover)}
.preset[aria-checked="true"]{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--text)}
.preset[aria-checked="true"] .i{opacity:1}
.preset:focus-visible{outline:2px solid var(--focus);outline-offset:5px}
.presets-sep{width:1px;height:20px;margin:0 var(--space-0-5);background:var(--border-strong)}
.field-meta b{color:var(--text);font-weight:var(--weight-semibold)}

/* ── On-states wear the brand too (Decision 12): a switch's track when on (M2: --text). The track and its knob take a
   1px ring in --accent-edge, so a pale accent (which brand.ts darkens) still edges at 3:1 on the cream; on a dark accent
   the ring is the fill itself and doesn't show. Off stays --border-strong. ── */
.switch[aria-checked="true"] .track{background:var(--accent);box-shadow:inset 0 0 0 1px var(--accent-edge)}
.switch[aria-checked="true"] .track::after{box-shadow:0 0 0 1px var(--accent-edge)}

/* ── Rows, panels, cards, tags at rest: a thin warm border or a wash, no hard shadow ── */
.item.is-open{box-shadow:var(--shadow-edge)}
.si-card{box-shadow:var(--shadow-edge)}

/* ── Floating things: popovers, menus, pickers and dialogs take a thin warm frame and the neutral hard shadow
   (the tokens above). The tooltip and the toast are dark, so they keep their own edge. ── */
.pop,.menu,.lpop,.cal,.dialog{border:1px solid var(--frame-neutral)}
.tip{box-shadow:none}
.toast{box-shadow:var(--shadow-hard-neutral)}

/* ── The frame means "needs you": a stronger warm border, a tinted hard shadow and the tone's wash. It goes on
   errors and field problems only. Unpublished changes, the Publish button with drafts, locks and edits made
   elsewhere stay calm (the merge notice is .note.warn, but it's someone else's edit: data-note="draft-kept"). ── */
.note.warn:not([data-note="draft-kept"]){border:var(--frame-width) solid var(--frame-warning);box-shadow:var(--shadow-hard-warning)}
.note.danger{border:var(--frame-width) solid var(--frame-danger);box-shadow:var(--shadow-hard-danger)}
.si-card .notice.fail{border:var(--frame-width) solid var(--frame-danger);box-shadow:var(--shadow-hard-danger)}
/* Field problems: the control or row that has the problem. Its message under it stays as M2 has it. */
.ref.is-missing,.item.is-warn,.btnf.is-half,.lnk.is-missing .lnk-box{border:var(--frame-width) solid var(--frame-warning);box-shadow:var(--shadow-hard-warning)}
.btnf.is-half{background:var(--status-warning-wash)}
.lnk.is-bad .lnk-box,.prose-wrap:has(+ .field-warn){border:var(--frame-width) solid var(--frame-warning);box-shadow:var(--shadow-hard-warning)}
.numf .input[aria-invalid="true"],.media-field .alt[aria-invalid="true"],.gtag .input[aria-invalid="true"],.input:has(+ .field-warn[data-over]:not([hidden])){border-width:var(--frame-width);border-color:var(--frame-warning);box-shadow:var(--shadow-hard-warning)}
.input[aria-invalid="true"],.ed-add .input[aria-invalid="true"],.si-card .input[aria-invalid="true"]{border-width:var(--frame-width);border-color:var(--frame-danger);box-shadow:var(--shadow-hard-danger)}
.mdrop:has(~ .field-err){border:var(--frame-width) solid var(--frame-danger);background:var(--status-danger-wash);box-shadow:var(--shadow-hard-danger)}
.mfail{border:var(--frame-width) solid var(--frame-danger);box-shadow:var(--shadow-hard-danger)}
/* A row inside a clipped list (the editors list): the frame as a ring, no room for a shadow */
.ed.is-confirm{box-shadow:inset 0 0 0 var(--frame-width) var(--frame-warning)}
/* Focus still shows on a framed field: the tool's blue ring, the frame's shadow kept */
.lnk.is-bad .lnk-box:focus-within,.lnk.is-missing .lnk-box:focus-within,.prose-wrap:has(+ .field-warn):focus-within{border-color:var(--select);box-shadow:0 0 0 3px var(--select-halo),var(--shadow-hard-warning)}
.numf .input[aria-invalid="true"]:focus,.media-field .alt[aria-invalid="true"]:focus,.gtag .input[aria-invalid="true"]:focus,.input:has(+ .field-warn[data-over]:not([hidden])):focus{border-color:var(--select);box-shadow:0 0 0 3px var(--select-halo),var(--shadow-hard-warning)}
.input[aria-invalid="true"]:focus,.ed-add .input[aria-invalid="true"]:focus,.si-card .input[aria-invalid="true"]:focus{border-color:var(--status-danger);box-shadow:0 0 0 3px var(--status-danger-halo),var(--shadow-hard-danger)}
/* Dialogs: a destructive or lose-work one (Delete, Discard changes, Signed out) is framed in danger; a refusal
   that asks you to do something first (a shared block still in use) in warning. The tone is a class on .dialog. */
.dialog.danger{border:var(--frame-width) solid var(--frame-danger);box-shadow:var(--shadow-hard-danger)}
.dialog.warn{border:var(--frame-width) solid var(--frame-warning);box-shadow:var(--shadow-hard-warning)}

/* ── The dark bar: the pressed look in a form that reads on dark. Raised controls get a ring and a lighter
   bottom edge; the off-white controls an edge in warm mid-grey; quiet ones a pressed wash. ── */
.docbtn{box-shadow:inset 0 0 0 1px var(--bar-border-strong),0 var(--press-depth) 0 var(--edge-bar);transition:background var(--dur-fast),translate var(--dur-fast),box-shadow var(--dur-fast)}
.docbtn:active{translate:0 var(--press-depth);box-shadow:inset 0 0 0 1px var(--bar-border-strong),0 0 0 var(--edge-bar)}
.side-toggle:active,.seg button:active:not([aria-checked="true"]){background:var(--bar-raised-hover);color:var(--bar-text)}
.seg button[aria-checked="true"]{box-shadow:0 1px 0 var(--edge-bar-control)}
.pub{box-shadow:0 var(--press-depth) 0 var(--edge-bar);transition:border-color var(--dur-fast),translate var(--dur-fast),box-shadow var(--dur-fast)}
.pub:active{translate:0 var(--press-depth);box-shadow:0 0 0 var(--edge-bar)}
.toast .btn,.stage-aside .btn{box-shadow:0 var(--press-depth) 0 var(--edge-bar-control)}
.toast .btn:active:not(:disabled),.stage-aside .btn:active:not(:disabled){translate:0 var(--press-depth);box-shadow:0 0 0 var(--edge-bar-control)}
.stage-drop .acts .btn.ghost{box-shadow:none}
.stage-drop .acts .btn.ghost:active:not(:disabled){translate:none;background:var(--bar-raised);box-shadow:none}
/* The submission sheet is a light page on the stage: its buttons are the light chrome's again */
.stage-aside .sub-sheet .btn{box-shadow:var(--shadow-control)}
.stage-aside .sub-sheet .btn:active:not(:disabled){box-shadow:0 0 0 var(--edge-secondary)}
.stage-aside .sub-sheet .btn.ink{background:var(--accent);border-color:var(--accent-edge);color:var(--accent-ink);box-shadow:0 var(--press-depth) 0 var(--edge-accent)}
.stage-aside .sub-sheet .btn.ink:hover{background:var(--accent);border-color:var(--accent-edge);filter:brightness(.93)}
.stage-aside .sub-sheet .btn.ink:active:not(:disabled){box-shadow:0 0 0 var(--edge-accent)}
.stage-aside .sub-sheet .btn.quiet-danger{box-shadow:none}
.stage-aside .sub-sheet .btn.quiet-danger:active:not(:disabled){translate:none;background:var(--status-danger-wash)}
/* Needs you, on the bar: the same frame in its dark form */
.keep.loud{border:var(--frame-width) solid var(--frame-danger-on-dark);box-shadow:var(--shadow-hard-danger-on-dark)}
.pub.fail,.pub.fail:hover{border:var(--frame-width) solid var(--frame-danger-on-dark)}
.pub.fail{box-shadow:var(--shadow-hard-danger-on-dark)}
.pub.fail:active{box-shadow:0 0 0 var(--frame-danger-on-dark)}
.bar-warn{border:var(--frame-width) solid var(--frame-warning-on-dark);box-shadow:var(--shadow-hard-warning-on-dark);transition:translate var(--dur-fast),box-shadow var(--dur-fast)}
.bar-warn:active{translate:0 var(--press-depth);box-shadow:0 0 0 var(--frame-warning-on-dark)}
</style>
</head>

/* Contrast (WCAG) for text on the accent: it switches between dark and light (Decision 5). */
const hexRgb = (h) => [0, 2, 4].map((i) => parseInt(h.replace('#', '').slice(i, i + 2), 16) / 255);
const lum = (h) => { const [r, g, b] = hexRgb(h).map((c) => (c <= 0.03928 ? c / 12.92 : ((c + 0.055) / 1.055) ** 2.4)); return 0.2126 * r + 0.7152 * g + 0.0722 * b; };

const mix = (a, b, t) => '#' + hexRgb(a).map((v, i) => Math.round((v * (1 - t) + hexRgb(b)[i] * t) * 255).toString(16).padStart(2, '0')).join('');

/* Decision 12: the accent presets, chosen 2026-11-03. Navy first, the default

const toOklab = (h) => {
  const [r, g, b] = hexRgb(h).map((c) => (c <= 0.04045 ? c / 12.92 : ((c + 0.055) / 1.055) ** 2.4));
  const l = Math.cbrt(0.4122214708 * r + 0.5363325363 * g + 0.0514459929 * b), m = Math.cbrt(0.2119034982 * r + 0.6806995451 * g + 0.1073969566 * b), s = Math.cbrt(0.0883024619 * r + 0.2817188376 * g + 0.6299787005 * b);

};

};

/* ── Page renderers: each block's root carries data-block; editable elements carry data-field
   (and data-kind="text" when plain text can be typed on the page). Markers exist in preview renders only. ── */
/* Links (M5a): a document picked from the site, or a typed address: /path, https://…, mailto:, tel: or #anchor */
const ADDR_OK = /^(\/\S*|https:\/\/[^\s/.]+\.\S+|mailto:[^\s@]+@[^\s@]+\.\S+|tel:\+?[\d\s()-]{5,}|#[\w-]+)$/;
const docGone = (id) => !id || C?.[id]?.deleted || !(C?.[id] || (/^cs-\d+$/.test(id) && +id.slice(3) < CASES.length));
const linkOK = (l) => !!l && (l.doc ? !docGone(l.doc) : !!l.url && ADDR_OK.test(l.url.trim()));
const linkHref = (l) => (l?.doc ? ensureDoc(l.doc)?.url || '' : l?.url || '');
const linkKind = (u = '') => (u.startsWith('mailto:') ? 'mail' : u.startsWith('tel:') ? 'tel' : u.startsWith('#') ? 'anchor' : u.startsWith('/') ? 'path' : 'web');
const linkText = (l) => (!l ? '' : l.doc ? (docGone(l.doc) ? "a page that's gone" : ensureDoc(l.doc).url) : (l.url || '').replace(/^https:\/\//, '').replace(/^mailto:/, ''));
/* Rich text out: with headings off, an H2 or H3 written outside the editor (by an agent) shows as a paragraph */
const demote = (h) => (h || '').replace(/<h[23]([^>]*)>/g, '<p$1>').replace(/<\/h[23]>/g, '</p>');
const richOut = (h, headings) => (headings ? h || '' : demote(h));
const headingCount = (h) => ((h || '').match(/<h[23][\s>]/g) || []).length;

const R = {};
function lockupHTML(o, style, tag) {
  const set = (lines, s) => `<${tag} class="lk lk-${style}" data-set="${s}" data-style="${style}">${lines.filter((l) => l.trim()).map((l) => `<span>${esc(l)}</span>`).join(' ')}</${tag}>`;
  return `<div class="lk-wrap${o.phone ? ' has-phone' : ''}" data-field="lines">${set(o.lines, 'main')}${o.phone ? set(o.phone, 'phone') : ''}</div>`;

function mediaBox(m, { field, ratio, cls = '', loop = false } = {}) {
  if ((!isImg(m) && !isClip(m)) || S?.mediaUnset) return '';

  return `<div ${attrs}>${picIn(m, { tag: 'div' })}${play ? `<span class="s-play"><i></i>Play video <small>${fmtDur(m.duration)}</small></span>` : ''}</div>`;

R.hero = (b) => { const bs = fullBtns(b.buttons), m = b.media, has = isImg(m) || isClip(m); return `<section class="b-hero${has && (m.pic || isClip(m)) ? ' scrim' : ''}" data-block="${b.id}">${has ? `<div class="b-hero-media">${mediaBox(m, { field: 'media', cls: 'b-hero-ph', loop: true })}</div>` : ''}${lockupHTML(b, 'display', 'h1')}${b.intro ? `<p class="b-hero-intro" data-field="intro" data-kind="text">${br(b.intro)}</p>` : ''}${bs.length ? `<div class="s-btns" data-field="buttons">${bs.map((x) => `<a class="s-btn${x.style === 'Secondary' ? ' sec' : ''}" href="${esc(linkHref(x.link))}">${esc(x.label)}</a>`).join('')}</div>` : ''}</section>`; };

R.textmedia = (b) => `<section class="b-tm${b.side === 'Image right' ? ' right' : ''}${isImg(b.media) || isClip(b.media) ? '' : ' no-media'}" data-block="${b.id}">${mediaBox(b.media, { field: 'media', cls: 'b-tm-img' })}<div><h2 data-field="heading" data-kind="text" data-single>${esc(b.heading)}</h2>${b.body ? `<div class="b-tm-body" data-field="body" data-kind="richText">${richOut(b.body, !!b.rtOpt?.headings)}</div>` : ''}</div></section>`;

function caseHTML(d) {
