  AUTHORITATIVE for: the folder row on the Arrange screen and in the sidebar (icon, name, count, how it differs from a
  group row), the drop markers (beside / into a folder / inside a page or group) and their legend, the empty new folder,

-->

.drow:active:not(:disabled),.menu button:active:not(:disabled),.tb>button:active:not(:disabled),.cal-g button:active:not([aria-pressed="true"]),
.twisty:active,.add-row:active:not(:disabled),.rchip:active,.item-sum:active,.lv:active,.mini-seg button:active:not([aria-checked="true"]),
.linkbtn.subtle:active,.ptype:active,.srow:active,.frow:active{background:var(--surface-pressed)}
.add-row:active:not(:disabled){color:var(--select-strong)}
/* ── On-states wear the brand too (Decision 12): a switch's track when on (M2: --text). The track and its knob take a
   1px ring in --accent-edge, so a pale accent (which brand.ts darkens) still edges at 3:1 on the cream; on a dark accent
   the ring is the fill itself and doesn't show. Off stays --border-strong. ── */

.item.is-open{box-shadow:var(--shadow-edge)}

/* ══════════════════════════════════════════════════════════════════════════

   ══════════════════════════════════════════════════════════════════════════ */

.arow.is-held:hover{background:none}
/* Marks for what's changed here and not applied yet: the tool's blue in a chip, and the new address in blue */
.arow.is-gone .an .nm,.arow.is-gone .an>.i{color:var(--text-subtle)}
.arow.is-gone .aa{color:var(--text-subtle);font-family:var(--font-ui)}
/* A new group with nothing in it: a full dashed ring (an empty slot, like .empty and .add-row), and its line under it */
.arow.is-empty{border:1px dashed var(--border-strong)}
.arow-sub{display:flex;align-items:center;flex-wrap:wrap;gap:var(--space-1-5) var(--space-2);min-height:24px;margin:0 0 var(--space-1);padding-left:calc(var(--arr-grip-w) + var(--depth,0) * var(--tree-indent) + 24px);font-size:var(--text-sm);color:var(--text-muted)}
.arow-sub.err{color:var(--status-danger);font-weight:var(--weight-medium)}
.arow-sub .i{flex:none}
/* Naming a new group, or renaming one, in its row */
.arow.is-naming{background:var(--surface-sunken);border-color:var(--border)}
.arow.is-naming:hover{background:var(--surface-sunken)}
.arow.is-naming .an .input{width:min(260px,100%);min-height:26px;height:26px;padding:2px 8px;font-size:var(--text-base)}
.arow.is-naming .ae .btn{flex:none}
/* Linked from the review: hovering an entry there washes its row here */
.arow.is-linked{background:var(--select-wash)}
/* Dragging. The row being dragged keeps its place as a dashed outline (the block list's ghost, .brow.is-ghost); what's under it goes with it. */
.arow.is-src{background:none;border:1px dashed var(--border-strong)}
.arow.is-src>*{visibility:hidden}
/* Inside: the row it goes into gets the selection's wash and a full 2px ring, and says so at its end */
.arow.is-into,.arow.is-into:hover{background:var(--select-wash);border-color:var(--select);box-shadow:0 0 0 1px var(--select)}
.arow.is-into .an .nm{color:var(--select-strong);font-weight:var(--weight-semibold)}
.arow.is-into .an>.i{color:var(--select-strong)}
.tag{display:inline-flex;align-items:center;gap:var(--space-1);height:20px;padding:0 var(--space-2);border-radius:var(--radius-pill);background:var(--select);color:var(--on-fill);font-size:var(--text-xs);font-weight:var(--weight-semibold);white-space:nowrap}
/* Refused: a danger wash and a full thin ring, and the reason in one line across the address and the end */
.arow.is-refused,.arow.is-refused:hover{background:var(--status-danger-wash);border-color:var(--status-danger-border)}
.arow-why{grid-column:3 / 5;display:flex;align-items:center;gap:var(--space-1-5);min-width:0;padding-right:var(--space-2);font-size:var(--text-sm);font-weight:var(--weight-medium);color:var(--status-danger);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* Beside: a 2px line between two rows, starting where that level's icons start (so its indent says which level), a ring at its
   start, and the level it lands in at its end. The line is a marker across the row, never a bar down a card's side. */
.amark{position:absolute;right:0;z-index:4;height:var(--arr-mark);border-radius:2px;background:var(--select);box-shadow:0 0 0 2px var(--surface);pointer-events:none}
.amark::before{content:"";position:absolute;left:-4px;top:50%;width:8px;height:8px;translate:0 -50%;border:2px solid var(--select);border-radius:50%;background:var(--surface)}
.amark .tag{position:absolute;right:var(--space-1);top:50%;translate:0 -50%;box-shadow:0 0 0 2px var(--surface)}
/* The card under the pointer while dragging */
.adrag{position:fixed;left:0;top:0;z-index:70;display:grid;grid-template-columns:16px minmax(0,1fr);align-items:center;gap:2px var(--space-2);min-width:220px;max-width:var(--arr-ghost-w);padding:var(--space-2) var(--space-3) var(--space-2) var(--space-2-5);background:var(--surface);border:1px solid var(--border-strong);border-radius:var(--radius-md);box-shadow:var(--shadow-drag);pointer-events:none;font-size:var(--text-base)}
.adrag>.i{color:var(--icon)}
.adrag .nm{display:flex;align-items:baseline;gap:var(--space-1-5);min-width:0;font-weight:var(--weight-semibold);white-space:nowrap;overflow:hidden}
.adrag .nm small{font-size:var(--text-xs);font-weight:var(--weight-regular);color:var(--text-subtle);overflow:hidden;text-overflow:ellipsis}
.adrag .to{grid-column:2;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font:var(--text-xs)/1.35 var(--font-mono);color:var(--select-strong)}
.adrag .to.plain{font-family:var(--font-ui);color:var(--text-muted)}
.adrag.no{border-color:var(--status-danger-border)}
.adrag.no .to{display:flex;align-items:center;gap:var(--space-1);font-family:var(--font-ui);font-weight:var(--weight-medium);color:var(--status-danger)}
body.is-dragging,body.is-dragging *{cursor:grabbing!important;user-select:none}
body.is-dragging.is-no,body.is-dragging.is-no *{cursor:not-allowed!important}

/* The pane's levels: Arrange pages, then Review */
.arr-none{font-size:var(--text-sm);color:var(--text-muted)}
.chg{list-style:none;margin:0 calc(-1 * var(--space-1));padding:0;display:flex;flex-direction:column;gap:1px}
.chg li{display:grid;grid-template-columns:16px minmax(0,1fr);gap:var(--space-2);padding:var(--space-1-5) var(--space-1);border-radius:var(--radius-md);font-size:var(--text-sm);color:var(--text-muted);line-height:1.4}
.chg li .i{margin-top:1px;color:var(--icon)}
.chg li b{color:var(--text);font-weight:var(--weight-semibold)}
.chg li.is-muted b{color:var(--text-muted)}
.arr-foot{flex:none;padding:var(--space-3) var(--space-4) var(--space-4);border-top:1px solid var(--border);background:var(--surface)}
.arr-foot .why{display:grid;grid-template-columns:16px minmax(0,1fr);gap:var(--space-1-5);margin-bottom:var(--space-3);font-size:var(--text-sm);color:var(--text-muted)}
.arr-foot .why .i{margin-top:1px;color:var(--icon)}
.arr-foot .why b{color:var(--text);font-weight:var(--weight-semibold)}
.arr-foot .busy{margin-bottom:var(--space-3);font-size:var(--text-sm);color:var(--status-waiting)}
.arr-foot .acts{display:flex;justify-content:flex-end;gap:var(--space-2)}
/* The review: what moves, where, and whether old links keep working */
.rv-lead{margin-bottom:var(--space-4);font-size:var(--text-md);font-weight:var(--weight-semibold);line-height:1.35}
.rv-lead small{display:block;margin-top:2px;font-size:var(--text-sm);font-weight:var(--weight-regular);color:var(--text-muted)}
.rv{list-style:none;margin:0 calc(-1 * var(--space-1));padding:0;display:flex;flex-direction:column;gap:1px}
.rv-e{display:grid;grid-template-columns:16px minmax(0,1fr);column-gap:var(--space-2);row-gap:1px;margin-left:calc(var(--in,0) * var(--tree-indent));padding:var(--space-1-5) var(--space-1);border-radius:var(--radius-md);transition:background var(--dur-fast)}
.rv-e:hover{background:var(--surface-hover)}
.rv-e>.i{margin-top:1px;color:var(--icon)}
.rv-e .t{display:flex;align-items:center;flex-wrap:wrap;gap:var(--space-1) var(--space-1-5);min-width:0;font-weight:var(--weight-semibold);line-height:1.35}
.rv-e .t .chip{height:18px;font-size:var(--text-2xs)}
.rv-e.is-carried .t,.rv-e.is-held .t{font-weight:var(--weight-medium)}
.rv-e.is-gone .t{font-weight:var(--weight-medium);color:var(--text-muted)}
.rv-e.is-gone>.i{color:var(--text-subtle)}
.mv{grid-column:2;display:flex;flex-wrap:wrap;column-gap:var(--space-1);min-width:0;font:var(--text-xs)/1.5 var(--font-mono);color:var(--text-subtle);overflow-wrap:anywhere}
.mv .to{color:var(--text)}
.rv-more{margin-left:auto;font-size:var(--text-xs)}
.rv-more .i{transition:rotate var(--dur-fast) var(--ease-out)}
.rv-more[aria-expanded="true"] .i{rotate:90deg}
.rv-docs{grid-column:2;list-style:none;margin:var(--space-1-5) 0 0;padding:var(--space-1-5) var(--space-2);border:1px solid var(--border);border-radius:var(--radius-md);background:var(--surface-sunken);font:var(--text-xs)/1.6 var(--font-mono);color:var(--text-muted);overflow-wrap:anywhere}
.rv-docs li.is-new{color:var(--status-warning-strong);font-weight:var(--weight-medium)}
.rv-tick{margin-top:var(--space-4);padding-top:var(--space-4);border-top:1px solid var(--border)}
.rv-tick .field-help{margin-bottom:0}

/* The fake page in the preview (entry and applied states only): a stand-in for the starter's Home */
.fk{height:100%;overflow:hidden;background:#fff;color:#141412;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}
.fk-h{display:flex;align-items:center;justify-content:space-between;height:56px;padding:0 7%;font-size:13.5px}
.fk-h b{font-size:16px}
.fk-h nav{display:flex;gap:24px}
.fk-hero{padding:15% 7% 6%;background:radial-gradient(70% 90% at 85% 30%,#4a453c 0,#1f1d19 45%,#141311 100%);color:#fff}
.fk-hero h1{margin:0 0 18px;font-size:clamp(34px,4.6vw,62px);font-weight:600;line-height:1.04;letter-spacing:-.025em}
.fk-hero p{max-width:470px;font-size:14.5px;line-height:1.55;opacity:.86}
.fk-sec{display:grid;grid-template-columns:1fr 1.3fr;gap:5%;padding:5% 7%}
.fk-sec h2{margin:0;font-size:clamp(22px,2.4vw,32px);font-weight:500;letter-spacing:-.02em}
.fk-sec p{font-size:13px;line-height:1.6;color:#444}

/* ══ Mockup review tool (not part of the design) ══ */
.mkr{position:fixed;right:12px;bottom:calc(var(--bar-h) + 12px);z-index:10000;display:flex;flex-direction:column-reverse;align-items:flex-end;gap:6px;color:#3b0764;font:500 11.5px/1.4 var(--font-mono);--mk-bg:#faf5ff;--mk-line:#a855f7}
.mkr button,.mkr a{font:inherit;color:inherit}
.mkr-tab{display:flex;align-items:center;gap:4px;padding:4px;background:var(--mk-bg);border:1px dashed var(--mk-line);border-radius:10px;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.mkr-tab .lbl{max-width:300px;padding:0 4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mkr-b{height:24px;min-width:24px;padding:0 7px;border:1px solid #d8b4fe;border-radius:6px;background:#fff;cursor:pointer;white-space:nowrap}
.mkr-b:hover{background:#f3e8ff}
.mkr-b.on{background:#7e22ce;border-color:#7e22ce;color:#fff}
.mkr-panel{width:390px;max-height:calc(100vh - 120px);overflow:auto;padding:12px;background:var(--mk-bg);border:1px dashed var(--mk-line);border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.28)}
.mkr-panel h4{margin:12px 0 4px;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:#7e22ce}
.mkr-panel h4:first-child{margin-top:0}
.mkr-s{display:flex;gap:6px;padding:3px 6px;border-radius:5px;text-decoration:none}
.mkr-s:hover{background:#f3e8ff}
.mkr-s.on{background:#7e22ce;color:#fff}
.mkr-s .n{width:20px;flex:none;opacity:.6;text-align:right}
.mkr-panel ul{margin:4px 0 0;padding-left:16px;color:#581c87;line-height:1.45}
.mkr-panel li{margin:3px 0}
.mk-ann{outline:1.5px dashed #a855f7;outline-offset:3px;border-radius:4px}

/* ══════════════════════════════════════════════════════════════════════════
   PAGE FOLDERS. New with this spec: additions to levels/arrange.css (the Arrange
   screen) and editor.css's .drow rows (the sidebar's Pages tree).
   A folder is told from a group by three things, none of them a rail:
   - its icon: a plain folder. A group's folder now carries a "/" (i-folder-addr), because it is in the address;
   - its address column: "Not in the addresses" in words, where a group shows /about-us/… in mono;
   - its count: the rows filed in it (Decision 8). A group shows its address in that place instead.
   The drop markers: beside = the 2px line (as shipped); into a folder = a DASHED 2px ring and an OUTLINED tag (it files
   the row, addresses stay); inside a page or group = the solid 2px ring and FILLED tag (as shipped: addresses change).
   ══════════════════════════════════════════════════════════════════════════ */
:root{
  --fold-ring-style:dashed;  /* into a folder: the inside ring's weight (--arr-mark), dashed */
  --fold-menu-w:300px;       /* a folder's or group's ··· menu on the Arrange screen: room for its why lines */
  --fold-side-menu-w:264px;  /* a folder's ··· menu in the sidebar */
  --fold-part-w:168px;       /* the address-part field in Put in the addresses */
}
/* The head: two "New" buttons, and the legend's third key */
.arr-tools{display:flex;gap:var(--space-2)}
.key-dash{width:26px;height:14px;border-radius:var(--radius-sm);background:var(--select-wash);outline:var(--arr-mark) var(--fold-ring-style) var(--select)}
/* A folder's address column says it isn't in the addresses, in words */
.aa.plain{font:var(--text-sm)/1.3 var(--font-ui);color:var(--text-subtle)}
.aa.plain .was .mono{font-size:var(--text-xs)}
/* Into a folder: the selection's wash and a dashed ring; its tag outlined, not filled */
.arow.is-file,.arow.is-file:hover{background:var(--select-wash);outline:var(--arr-mark) var(--fold-ring-style) var(--select);outline-offset:-1px}
.arow.is-file .an .nm{color:var(--select-strong);font-weight:var(--weight-semibold)}
.arow.is-file .an>.i{color:var(--select-strong)}
.tag.file{background:var(--surface);color:var(--select-strong);box-shadow:inset 0 0 0 1.5px var(--select)}
/* The row this one clashes with, washed so it's found (as a review entry's linked row) */
.arow.is-linked .aa{color:var(--text)}
/* The menu, as shipped (editor.css; the arrange mockup didn't carry it) */
.menu{position:absolute;z-index:6;min-width:200px;padding:var(--space-1);background:var(--surface);border-radius:var(--radius-lg);box-shadow:var(--shadow-pop);animation:pop-in var(--dur-base) var(--ease-out)}
.menu button{display:flex;align-items:center;gap:var(--space-2);width:100%;height:30px;padding:0 var(--space-2);border:0;border-radius:var(--radius-sm);background:none;text-align:left;font-size:var(--text-base)}
.menu button:hover:not(:disabled){background:var(--surface-hover)}
.menu button:disabled{color:var(--text-subtle);cursor:not-allowed}
.menu hr{margin:var(--space-1) 0;border:0;border-top:1px solid var(--border)}
.menu .why{padding:2px var(--space-2) var(--space-1-5);font-size:var(--text-xs);color:var(--text-subtle)}
/* A row's ··· and its menu (Put in / Take out of the addresses, Remove) */
.ae{position:relative}
.ae .ib.act{width:26px;height:26px}
.ae .ib[aria-expanded="true"]{opacity:1;background:var(--surface-pressed);color:var(--text)}
.ae .menu{right:var(--space-1);top:calc(100% + 6px);width:var(--fold-menu-w)}
.menu button .i{color:var(--icon)}
.menu .why{padding-left:calc(var(--space-2) + 16px + var(--space-2));line-height:1.4}
.menu .why .mono{font-size:var(--text-2xs)}
/* Put in the addresses: the address part, edited in the address column */
.arow.is-naming .aa{overflow:visible}
.aa .part{display:inline-flex;align-items:center;gap:3px;color:var(--text-muted)}
.aa .part .input{width:var(--fold-part-w);min-height:26px;height:26px;padding:2px 6px;font:var(--text-sm)/1.3 var(--font-mono);color:var(--text)}
.arow.is-naming .an .nm{font-weight:var(--weight-semibold)}
/* The review: an address that isn't one ("Not in the addresses") reads as words */
.mv .plain{font-family:var(--font-ui)}
.rv-e .t .sub{font-weight:var(--weight-regular);color:var(--text-muted)}
.rv-after{margin-top:var(--space-3)}
/* The sidebar: a folder's count and a group's address sit where the meta sits */
.drow .gaddr{min-width:0;overflow:hidden;text-overflow:ellipsis;font:var(--text-xs)/1 var(--font-mono);color:var(--text-subtle)}
.drow.is-folder .cnt{font-variant-numeric:tabular-nums}
.tnode>.menu{right:var(--space-1);top:calc(var(--row-h) + 2px);width:var(--fold-side-menu-w)}
.row-more[aria-expanded="true"]{opacity:1;background:var(--surface-pressed);color:var(--text)}
.toast .i.warn-i{color:var(--frame-warning)}

/* ── The too-narrow note (editor.css, shipped): under 1,024 wide the editor shows this instead ── */
.screen{position:absolute;inset:0;z-index:var(--z-screen);display:none;overflow:auto;background:var(--surface-sunken)}
@container app (max-width:1023px){
  #app[data-screen="editor"] .screen.narrow{display:block}
  #app[data-screen="editor"] .editor{visibility:hidden}
}
.nw{min-height:100%;display:flex;align-items:center;justify-content:center;padding:var(--space-8) var(--space-5)}
.nw-in{width:100%;max-width:420px}
.nw-brand{display:flex;align-items:center;gap:var(--space-2-5);margin-bottom:var(--space-8);font-weight:var(--weight-semibold);font-size:var(--text-md)}
.nw h1{margin:0 0 var(--space-3);font-size:var(--text-2xl);font-weight:var(--weight-semibold);letter-spacing:var(--tracking-tight);line-height:1.2}
.nw p{color:var(--text-muted);font-size:var(--text-md)}
.nw p+p{margin-top:var(--space-3)}
.nw .addr{display:flex;align-items:center;justify-content:space-between;gap:var(--space-2);margin-top:var(--space-5);padding:var(--space-2) var(--space-2) var(--space-2) var(--space-3);border:1px solid var(--border-strong);border-radius:var(--radius-md);background:var(--surface);font-family:var(--font-mono);font-size:var(--text-sm);overflow-wrap:anywhere}
.si-logo{width:28px;height:28px;flex:none}
.si-logo svg{display:block;width:100%;height:100%}
@media (max-width:600px){.mkr-panel{width:calc(100vw - 24px)}.mkr-tab .lbl{max-width:150px}}
</style>
</head>

<script>
'use strict';
/* ══ Helpers (as the arrange mockup's) ══ */
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const ic = (n, c = '') => `<svg class="i${c ? ' ' + c : ''}" aria-hidden="true"><use href="#i-${n}"/></svg>`;
const PEOPLE = { niamh: 'Niamh', aoife: 'Aoife' };
const av = (p, c = '') => `<span class="av${c ? ' ' + c : ''}" style="--c:var(--p-${p})" title="${PEOPLE[p]}">${PEOPLE[p][0]}</span>`;
const plural = (k, one, many) => `${k} ${k === 1 ? one : many}`;
const andList = (a) => (a.length < 2 ? a.join('') : `${a.slice(0, -1).join(', ')} and ${a[a.length - 1]}`);
const slugify = (s) => s.normalize('NFKD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/&/g, ' and ').replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
const chip = (t, c = 'select') => `<span class="chip ${c}">${esc(t)}</span>`;
const SITE = 'The quarry';
const LOGO = '<svg viewBox="0 0 22 22" aria-hidden="true"><rect width="22" height="22" rx="4" fill="#4a4f57"/><path d="M4 16.5 8.8 8.2l3 4.9 2-2.9 4.2 6.3z" fill="#fff"/></svg>';

/* ══ Sample content: a ported quarry site. Flat addresses; the nav's About Us dropdown is what the folder follows ══ */
const PRODUCTS = { label: 'Products', icon: 'case', count: 31, many: 'products' };
const P = (label, slug, o = {}, kids = []) => ({ id: o.id || slug, kind: 'page', label, slug, holds: o.holds || null, kids });
const G = (label, slug, kids = [], id) => ({ id: id || 'g-' + slug, kind: 'group', label, slug, kids });
const F = (label, kids = [], id) => ({ id: id || 'f-' + slugify(label), kind: 'folder', label, slug: null, kids });
const pg = {
  home: () => P('Home', 'home'), aggregates: () => P('Aggregates', 'aggregates', { holds: PRODUCTS }), apply: () => P('Apply', 'apply'),
  contact: () => P('Contact', 'contact'), civil: () => P('Civil Works', 'civil-works'), join: () => P('Join The Team', 'join'),
  order: () => P('Order Aggregate', 'order-aggregate'), privacy: () => P('Privacy', 'privacy'), quarries: () => P('Quarries', 'quarries'),
  quote: () => P('Request a Quote', 'request-a-quote'), who: () => P('Who We Are', 'who-we-are'),
};
const about = () => F('About Us', [pg.who(), pg.join(), pg.quarries()], 'about-us');
const wwd = () => F('What We Do', [pg.aggregates(), pg.civil(), pg.order(), pg.quote()]);
const T = {
  flat: () => [pg.home(), pg.aggregates(), pg.apply(), pg.contact(), pg.civil(), pg.join(), pg.order(), pg.privacy(), pg.quarries(), pg.quote(), pg.who()],
  one: () => [pg.home(), about(), pg.aggregates(), pg.apply(), pg.contact(), pg.civil(), pg.order(), pg.privacy(), pg.quote()],
  two: () => [pg.home(), about(), wwd(), pg.apply(), pg.contact(), pg.privacy()],
  removed: () => [pg.home(), pg.who(), pg.join(), pg.quarries(), pg.aggregates(), pg.apply(), pg.contact(), pg.civil(), pg.order(), pg.privacy(), pg.quote()],
  drag: () => [pg.home(), about(), F('What We Do', [pg.aggregates(), pg.order(), pg.quote()]), pg.apply(), pg.contact(), pg.civil(), pg.privacy()],
  putIn: () => [pg.home(), G('About Us', 'about-us', [pg.who(), pg.join(), pg.quarries()], 'about-us'), wwd(), pg.apply(), pg.contact(), pg.privacy()],
  aggF: () => [pg.home(), about(), F('Aggregates', [pg.aggregates(), pg.order(), pg.quote()]), pg.apply(), pg.contact(), pg.civil(), pg.privacy()],
  contactF: () => [pg.home(), about(), F('Contact', [pg.quote(), pg.order()]), pg.aggregates(), pg.apply(), pg.contact(), pg.civil(), pg.privacy()],
  group: () => [pg.home(), G('About Us', 'about-us', [pg.who(), F('Careers', [pg.join(), pg.apply()]), pg.quarries()], 'about-us'), wwd(), pg.contact(), pg.privacy()],
  takenOut: () => [pg.home(), F('About Us', [pg.who(), pg.join(), pg.apply(), pg.quarries()], 'about-us'), wwd(), pg.contact(), pg.privacy()],
};

/* ══ The tree ══ */
function walk(nodes, fn, d = 0) { for (const n of nodes) { fn(n, d); walk(n.kids, fn, d + 1); } }
function find(tree, id) { let r = null; walk(tree, (n) => { if (n.id === id) r = n; }); return r; }
function counts(tree) { const c = { page: 0, group: 0, folder: 0 }; walk(tree, (n) => c[n.kind]++); return c; }
/* A folder's count: the rows filed in it, not the pages under them (Decision 8) */
const filed = (f) => f.kids.length;
const filedText = (f) => (f.kids.every((k) => k.kind === 'page') ? plural(filed(f), 'page', 'pages') : plural(filed(f), 'row', 'rows'));
/* Addresses: folders are skipped (null); a group reads /path/… */
function addrs(tree) {
  const m = new Map();
  const go = (nodes, base) => nodes.forEach((n) => {
    if (n.kind === 'folder') { m.set(n.id, null); go(n.kids, base); return; }
    const path = n.id === 'home' && !base ? '' : base ? `${base}/${n.slug}` : n.slug;
    m.set(n.id, n.kind === 'group' ? `/${path}/…` : `/${path}`);
    go(n.kids, path);
  });
  go(tree, '');
  return m;
}

/* ══ State ══ */
let S = null;
const fresh = () => ({ id: null, mode: 'arrange', orig: null, tree: null, drag: null, naming: null, renaming: null, putIn: null, menu: null, smenu: null,
  collapsed: new Set(['aggregates']), scol: new Set(), sopen: new Set(), chips: {}, refused: {}, sub: {}, linked: null, changes: [], why: undefined,
  nav: { review: null, back: 'open', apply: 'sidebar' }, review: null, tick: true, toast: null, current: 'who-we-are', waiting: 0, waitingIds: new Set() });
function use(o, n = o) { S.orig = T[o](); S.tree = T[n](); }

/* ══ The stage: the Arrange screen (or, for the sidebar states, the page in the preview) ══ */
const busy = () => !!(S.naming || S.renaming || S.putIn);
function stageHTML() {
  if (S.mode === 'side') return fakePage();
  const c = counts(S.tree), arranging = S.mode === 'arrange';
  const tools = arranging
    ? `<div class="arr-tools"><button type="button" class="btn sm" data-go="folder-naming" ${busy() ? 'disabled' : ''}>${ic('plus', 'i-sm')}New folder</button><button type="button" class="btn sm" ${busy() ? 'disabled' : ''}>${ic('plus', 'i-sm')}New group</button></div>`
    : `<span class="arr-ro">${ic('lock', 'i-sm')}Reviewing: go back to change anything</span>`;
  const hint = arranging
    ? `<span>Drag a row to order it, file it in a folder or put it inside another. Everything under a page moves with it.</span><span class="key"><span class="key-line" aria-hidden="true"></span>Beside a row, at that level</span><span class="key"><span class="key-dash" aria-hidden="true"></span>Into a folder: addresses stay</span><span class="key"><span class="key-ring" aria-hidden="true"></span>Inside a page or group: addresses change</span>`
    : `<span>This is how the Pages tree will read once it’s applied.</span>`;
  return `<section class="arr" aria-label="Arrange pages">
  <div class="arr-head"><div class="arr-head-in"><div class="arr-title"><h2>Pages</h2><span class="n-chip">${plural(c.page, 'page', 'pages')} · ${plural(c.group, 'group', 'groups')} · ${plural(c.folder, 'folder', 'folders')}</span></div><div>${tools}</div><div class="arr-hint">${hint}</div></div></div>
  <div class="arr-scroll" id="ascroll"><div class="arr-cols" aria-hidden="true"><span></span><span>Name</span><span>Address</span><span></span></div>
    <div class="arr-tree" id="atree" role="tree" aria-label="Pages">${rowsHTML()}<div class="amark" id="amark" hidden><span class="tag"></span></div></div></div>
</section>`;
}
function rowsHTML() {
  const out = [];
  const go = (nodes, d) => nodes.forEach((n) => {
    out.push(rowHTML(n, d));
    if (S.drag && S.drag.id === n.id) return; // what's under the dragged row goes with it
    const sub = subHTML(n, d);
    if (sub) out.push(sub);
    if (S.collapsed.has(n.id)) return;
    if (n.holds) out.push(heldHTML(n, d + 1));
    go(n.kids, d + 1);
  });
  go(S.tree, 0);
  if (S.naming) out.push(namingHTML());
  return out.join('');
}
const iconOf = (k) => (k === 'page' ? 'page' : k === 'group' ? 'folder-addr' : 'folder');
function rowHTML(n, d) {
  const id = n.id, k = n.kind, home = id === 'home';
  const now = S.A.get(id), was = S.O.has(id) ? S.O.get(id) : undefined;
  const t = S.drag && S.drag.target && S.drag.target.rowId === id ? S.drag.target : null;
  const arranging = S.mode === 'arrange';
  const renaming = S.renaming && S.renaming.id === id, putting = S.putIn && S.putIn.id === id;
  const draggable = arranging && !home && !busy();
  const src = S.drag && S.drag.id === id;
  const isNew = !!S.chips[id] && /New folder/.test(S.chips[id]);
  const empty = k === 'folder' && !n.kids.length;
  const cls = ['arow', `is-${k}`];
  if (home) cls.push('is-home');
  if (src) cls.push('is-src');
  if (empty && isNew && !renaming) cls.push('is-empty');
  if (renaming || putting) cls.push('is-naming');
  if (t) cls.push({ inside: 'is-into', folder: 'is-file', refused: 'is-refused' }[t.kind] || '');
  if (S.refused[id]) cls.push('is-refused');
  if (S.linked === id) cls.push('is-linked');
  // Name and marks
  const marks = [];
  if (home) marks.push('<span>Always first</span>');
  if (k === 'folder' && !empty && !renaming) marks.push(`<span class="cnt">${filedText(n)}</span>`);
  if (S.chips[id] && !renaming) marks.push(S.chips[id]);
  if (n.holds && S.collapsed.has(id)) marks.push(`<span class="cnt">${esc(n.holds.label)} · ${n.holds.count}</span>`);
  const name = renaming
    ? `<input class="input" id="rn-in" value="${esc(S.renaming.value)}" aria-label="New name for ${esc(n.label)}" autocomplete="off" spellcheck="false" ${S.renaming.err ? 'aria-invalid="true" aria-describedby="rn-sub"' : 'aria-describedby="rn-sub"'}>`
    : `<span class="nm">${esc(n.label)}</span>`;
  // Address
  let addr, plain = false;
  if (putting) addr = `<span class="part">/<input class="input" id="pi-in" value="${esc(S.putIn.value)}" aria-label="${esc(n.label)}’s address part" autocomplete="off" spellcheck="false" ${S.putIn.err ? 'aria-invalid="true"' : ''} aria-describedby="pi-sub">/</span>`;
  else if (k === 'folder') { plain = true; addr = renaming ? 'Name only: no address changes' : `Not in the addresses${typeof was === 'string' ? `<span class="was">was <span class="mono">${esc(was)}</span></span>` : ''}`; }
  else if (was !== undefined && was !== now) addr = `<span class="new">${esc(now)}</span>${was === null ? '<span class="was">was a folder</span>' : `<span class="was">was <span class="mono">${esc(was)}</span></span>`}`;
  else addr = esc(now);
  // End: the drop tag, or the row's actions, then the twisty
  const ends = [];
  if (t && t.kind === 'inside') ends.push(`<span class="tag">${ic('arrow-r', 'i-xs')}Inside ${esc(n.label)}</span>`);
  else if (t && t.kind === 'folder') ends.push(`<span class="tag file">${ic('folder', 'i-xs')}Into ${esc(n.label)}</span>`);
  else if (renaming) ends.push('<button type="button" class="btn sm ghost" data-go="open">Cancel</button>', `<button type="button" class="btn sm ink" ${S.renaming.err ? 'disabled' : ''}>Rename</button>`);
  else if (putting) ends.push('<button type="button" class="btn sm ghost" data-go="open">Cancel</button>', `<button type="button" class="btn sm ink" ${S.putIn.err ? 'disabled' : `data-go="${S.putIn.ok}"`}>Put in</button>`);
  else if (arranging && !busy() && (k === 'folder' || k === 'group')) {
    ends.push(`<button type="button" class="btn sm ghost act"${k === 'folder' ? ' data-go="folder-rename"' : ''}>Rename…</button>`);
    ends.push(`<button type="button" class="ib act" data-act="menu" data-id="${id}" aria-haspopup="menu" aria-expanded="${S.menu === id}" aria-label="More for the ${esc(n.label)} ${k}">${ic('more')}</button>`);
    if (S.menu === id) ends.push(rowMenuHTML(n));
  }
  const hasKids = n.kids.length || n.holds;
  ends.push(hasKids && !renaming && !putting ? `<button type="button" class="atw" data-act="twisty" data-id="${id}" aria-expanded="${!S.collapsed.has(id)}" aria-label="${S.collapsed.has(id) ? 'Show' : 'Hide'} what’s under ${esc(n.label)}">${ic('chev-r')}</button>` : '<span class="atw-gap"></span>');
  const why = t && t.kind === 'refused' ? t.reason : S.refused[id];
  const tail = why ? `<span class="arow-why" role="status">${ic('x', 'i-sm')}${esc(why)}</span>` : `<span class="aa${plain ? ' plain' : ''}">${addr}</span><span class="ae">${ends.join('')}</span>`;
  const title = home ? ' title="Home stays first, takes no pages and can’t be filed"' : k === 'folder' ? ` title="${esc(n.label)} is a folder: the pages in it keep their own addresses"` : '';
  return `<div class="${cls.join(' ')}" style="--depth:${d}" data-id="${id}" role="treeitem" aria-level="${d + 1}"${draggable ? ' data-drag=""' : ''}${title}><span class="ag" aria-hidden="true">${draggable ? ic('grip') : ''}</span><span class="an">${ic(iconOf(k))}${name}<span class="meta">${marks.join('')}</span></span>${tail}</div>`;
}
function subHTML(n, d) {
  const id = n.id;
  if (S.sub[id]) { const s = S.sub[id]; return `<div class="arow-sub${s.err ? ' err' : ''}" id="${s.key || 'sub-' + id}" style="--depth:${d}">${s.err ? ic('x', 'i-sm') : ''}<span>${s.html}</span></div>`; }
  if (n.kind === 'folder' && !n.kids.length && S.chips[id] && S.mode === 'arrange') return `<div class="arow-sub" style="--depth:${d}">Empty: add a page or remove it <button type="button" class="linkbtn" data-go="open">Remove</button></div>`;
  return '';
}
function rowMenuHTML(n) {
  const k = filed(n);
  if (n.kind === 'folder') return `<div class="menu" role="menu" aria-label="${esc(n.label)}">
    <button type="button" role="menuitem" data-go="put-in">${ic('folder-addr')}Put in the addresses</button>
    <div class="why">${filedText(n)} move${k === 1 ? 's' : ''} under <span class="mono">/${esc(slugify(n.label))}/</span>, in this order, and it becomes a group. Old addresses can redirect.</div>
    <hr>
    <button type="button" role="menuitem" data-go="folder-removed">${ic('x')}Remove</button>
    <div class="why">Its rows go back to this level, in its place. No address changes.</div></div>`;
  return `<div class="menu" role="menu" aria-label="${esc(n.label)}">
    <button type="button" role="menuitem" data-go="take-out-changed">${ic('folder')}Take out of the addresses</button>
    <div class="why">Its ${plural(k, 'row', 'rows')} move up a level, in this order, and a folder named ${esc(n.label)} takes its place. Old addresses can redirect.</div></div>`;
}
function heldHTML(n, d) {
  const h = n.holds, a = S.A.get(n.id);
  return `<div class="arow is-held" style="--depth:${d}" role="treeitem" aria-level="${d + 1}" title="${esc(h.label)} goes wherever ${esc(n.label)} goes"><span class="ag"></span><span class="an">${ic(h.icon)}<span class="nm">${esc(h.label)}</span><span class="meta"><span class="cnt">${h.count} ${esc(h.many)}</span></span></span><span class="aa">${esc(a)}/…</span><span class="ae"><span class="carried">Moves with ${esc(n.label)}</span><span class="atw-gap"></span></span></div>`;
}
function namingHTML() {
  return `<div class="arow is-folder is-naming" style="--depth:0" data-id="naming"><span class="ag"></span><span class="an">${ic('folder')}<input class="input" id="nf-in" value="${esc(S.naming.value)}" placeholder="Folder name, e.g. About Us" aria-label="New folder’s name" aria-describedby="nf-sub" autocomplete="off" spellcheck="false"></span><span class="aa plain">Not in the addresses</span><span class="ae"><button type="button" class="btn sm ghost" data-go="open">Cancel</button><button type="button" class="btn sm ink" data-go="folder-empty">Add folder</button><span class="atw-gap"></span></span></div><div class="arow-sub" id="nf-sub" style="--depth:0">Goes at the end of the top level. Drag it where you want it, then drag pages into it: they keep their addresses.</div>`;
}

/* The drawn drag: the marker and the card under the pointer */
function ghostHTML() {
  const n = find(S.tree, S.drag.id), t = S.drag.target;
  const small = n.kind === 'folder' ? `<small>${filedText(n)}</small>` : '';
  const to = t.kind === 'refused' ? `<span class="to">${ic('x', 'i-xs')}${esc(t.reason)}</span>` : `<span class="to${S.drag.plain ? ' plain' : ''}">${esc(S.drag.to)}</span>`;
  return `${ic(iconOf(n.kind))}<span class="nm">${esc(n.label)}${small}</span>${to}`;
}
function placeDrag() {
  const g = $('#aghost');
  if (!S.drag || S.mode !== 'arrange') { g.hidden = true; return; }
  const t = S.drag.target, tree = $('#atree'), row = tree && tree.querySelector(`.arow[data-id="${CSS.escape(t.rowId)}"]`);
  g.innerHTML = ghostHTML();
  g.classList.toggle('no', t.kind === 'refused');
  g.hidden = false;
  if (!row) return;
  const r = row.getBoundingClientRect(), tr = tree.getBoundingClientRect();
  if (t.kind === 'beside') {
    const m = $('#amark');
    m.hidden = false;
    m.style.top = `${(t.edge === 'top' ? r.top : r.bottom) - tr.top - 1}px`;
    m.style.left = `${24 + t.depth * 16 + 4}px`;
    m.querySelector('.tag').textContent = t.tag;
  }
  const yy = t.kind === 'beside' ? (t.edge === 'top' ? r.top : r.bottom) - 6 : r.top + r.height / 2 - 4;
  g.style.translate = `${Math.round(r.left + 150 + (t.depth || 0) * 16)}px ${Math.round(yy + 10)}px`;
}

/* ══ The pane ══ */
const trailHome = () => `<button type="button" class="lv" data-go="sidebar"><b>${SITE}</b><span class="n">44</span></button>`;
function arrangeLevel() {
  const items = S.changes;
  const why = S.why !== undefined ? S.why : items.length ? null : 'Nothing to review yet.';
  return `<div class="side-level">
  <div class="trail">${trailHome()}
    <div class="cur"><div class="cur-row"><button type="button" class="ib" data-go="sidebar" aria-label="Back to documents">${ic('chev-l')}</button><div class="cur-title"><span class="t"><span>Arrange pages</span></span><span class="sub">Nothing changes until you apply</span></div></div></div></div>
  <div class="side-body">
    <h3 class="sec-h">Changes${items.length ? ` <span class="n">${items.length}</span>` : ''}</h3>
    ${items.length ? `<ul class="chg">${items.map(([i, h, muted]) => `<li${muted ? ' class="is-muted"' : ''}>${ic(i)}<span>${h}</span></li>`).join('')}</ul>` : '<p class="arr-none">None yet. Drag a row on the right to start.</p>'}
    <p class="fixed-line">${ic('clock')}<span>Kept only in this tab until you apply. Leaving or reloading the page drops it.</span></p>
  </div>
  <div class="arr-foot">${why ? `<p class="why" id="rv-why">${ic('warn')}<span>${why}</span></p>` : ''}<div class="acts"><button type="button" class="btn" data-go="sidebar">Cancel</button><button type="button" class="btn ink" ${why ? 'disabled aria-describedby="rv-why"' : S.nav.review ? `data-go="${S.nav.review}"` : ''}>Review…</button></div></div>
</div>`;
}
function reviewLevel() {
  const r = S.review;
  return `<div class="side-level">

/* The sidebar's documents level */
function docsLevel() {
  const rows = [];
  const go = (nodes, d) => nodes.forEach((n) => {
    if (n.kind === 'folder' || n.kind === 'group') {
      if (!n.kids.length) return;
      const open = !S.scol.has(n.id), isF = n.kind === 'folder';
      const meta = isF ? `<span class="cnt">${filed(n)}</span>` : `<span class="gaddr">${esc(S.A.get(n.id))}</span>`;
      const bubble = !open && [...S.waitingIds].some((w) => find(n.kids, w)) ? '<span class="dot" title="Waiting to be published"></span>' : '';
      rows.push(`<div class="tnode"><button type="button" class="drow t is-group${isF ? ' is-folder' : ''}" style="--depth:${d}" data-act="stw" data-id="${n.id}" aria-expanded="${open}" title="${isF ? `${esc(n.label)} is a folder: its pages keep their own addresses` : `${esc(n.label)} has no page of its own`}">${ic(iconOf(n.kind))}<span class="nm">${esc(n.label)}</span><span class="meta">${bubble}${meta}</span><span class="tw" aria-hidden="true">${ic('chev-r', 'i-xs')}</span></button><button type="button" class="ib row-more" data-act="smenu" data-id="${n.id}" aria-haspopup="menu" aria-expanded="${S.smenu === n.id}" aria-label="Actions for the ${esc(n.label)} ${n.kind}">${ic('more')}</button>${S.smenu === n.id ? sideMenuHTML(n) : ''}</div>`);
      if (open) go(n.kids, d + 1);
      return;
    }
    const kids = n.kids.length || n.holds, open = kids && S.sopen.has(n.id);
    const dot = S.waitingIds.has(n.id) ? '<span class="dot" title="Waiting to be published"></span>' : '';
    rows.push(`<div class="tnode"><button type="button" class="drow t${kids ? ' has-kids' : ''}${n.id === S.current ? ' is-current' : ''}" style="--depth:${d}">${ic('page')}<span class="nm">${esc(n.label)}</span><span class="meta">${dot}</span></button>${kids ? `<button type="button" class="twisty" data-act="sopen" data-id="${n.id}" aria-expanded="${!!open}" aria-label="${open ? 'Hide' : 'Show'} the pages under ${esc(n.label)}">${ic('chev-r', 'i-xs')}</button>` : ''}</div>`);
    if (open) {
      if (n.holds) rows.push(`<div class="tnode"><button type="button" class="drow t coll" style="--depth:${d + 1}">${ic(n.holds.icon)}<span class="nm">${esc(n.holds.label)}</span><span class="meta"><span class="cnt">${n.holds.count}</span></span></button></div>`);
      go(n.kids, d + 1);
    }
  });
  go(S.tree, 0);
  return `<div class="side-level">
  <div class="trail"><div class="cur"><div class="cur-row"><span class="logo-slot" aria-hidden="true">${LOGO}</span><div class="cur-title"><span class="t"><span>${SITE}</span></span><span class="sub">44 documents · localhost:4326</span></div><button type="button" class="ib" aria-label="Hide the sidebar" title="Hide the sidebar (⌘\\)">${ic('sidebar')}</button></div></div></div>
  <div class="side-body flush">
    <label class="find">${ic('search')}<input class="input" placeholder="Find a document" aria-label="Find a document"></label>
    <section class="grp" aria-label="Pages"><div class="grp-h">Pages <span class="n">${counts(S.tree).page}</span><span class="sp"></span><button type="button" class="linkbtn subtle" data-go="open">Arrange pages…</button><span style="width:6px"></span><button type="button" class="linkbtn">${ic('plus', 'i-sm')}New page</button></div>${rows.join('')}</section>
    <section class="grp" aria-label="Collections"><div class="grp-h">Collections <span class="n">1</span></div>
      <button type="button" class="drow coll">${ic('journal')}<span class="nm">News</span><span class="meta"><span class="cnt">12</span></span>${ic('chev-r')}</button></section>
    <section class="grp" aria-label="Site-wide"><div class="grp-h">Site-wide</div>
      <button type="button" class="drow coll">${ic('shared')}<span class="nm">Shared blocks</span><span class="meta"><span class="cnt">2</span></span>${ic('chev-r')}</button>
      <button type="button" class="drow coll">${ic('media')}<span class="nm">Media</span><span class="meta"></span>${ic('chev-r')}</button>
      <button type="button" class="drow">${ic('gear')}<span class="nm">Site Settings</span></button>
      <button type="button" class="drow coll">${ic('inbox')}<span class="nm">Submissions</span><span class="meta"></span>${ic('chev-r')}</button></section>
  </div>
  <div class="side-foot"><div class="rchips"><button type="button" class="rchip is-current">${esc(find(S.tree, S.current)?.label || 'Home')}</button><button type="button" class="rchip">Home</button><button type="button" class="rchip">Contact</button></div></div>
</div>`;
}
function sideMenuHTML(n) {
  if (n.kind === 'folder') return `<div class="menu" role="menu" aria-label="${esc(n.label)}">
    <button type="button" role="menuitem" data-go="sidebar-made">${ic('plus')}New page in ${esc(n.label)}</button>

    <button type="button" role="menuitem">${ic('page')}Create a page at ${esc(a)}</button>
    <div class="why">${esc(n.label)} has no page of its own. Its ${plural(filed(n), 'page', 'pages')} stay under it.</div>

  S.A = addrs(S.tree);

  { id: 'sidebar-made', g: 'Sidebar', label: 'New page in About Us: Careers, at /careers, at the folder’s end', run: sideState(() => {
    use('one'); find(S.tree, 'about-us').kids.push(P('Careers', 'careers')); S.current = 'careers'; S.waiting = 1; S.waitingIds.add('careers'); }) },
  { id: 'sidebar-unkept', g: 'Sidebar', label: 'New page in About Us, Site Settings unreadable: made unfiled, a line says why', run: sideState(() => {
    use('one'); S.tree.splice(2, 0, P('Careers', 'careers')); S.current = 'careers'; S.waiting = 1; S.waitingIds.add('careers');
    S.toast = `<div class="toast" role="status">${ic('warn', 'i-sm warn-i')}<span class="t">Site Settings isn’t valid JSON, so Careers couldn’t be filed in About Us. It was made at /careers: fix Site Settings, then file it in Arrange pages.</span></div>`; }) },
  { id: 'sidebar-both', g: 'Sidebar', label: 'A group and a folder side by side (after Put in the addresses)', run: sideState(() => {
    use('putIn'); S.waiting = 3; ['who-we-are', 'join', 'quarries'].forEach((id) => S.waitingIds.add(id)); }) },
];
function dragChanges() {
  S.chips['f-what-we-do'] = chip('New folder');
  S.changes = [['folder', '<b>What We Do</b> is a new folder'], ['arrow-r', '<b>Aggregates</b>, <b>Order Aggregate</b> and <b>Request a Quote</b> go into What We Do'], ['list', 'The order changes at the top level']];
  S.nav.review = null; S.why = null;
}
function applyState(id) {
  const st = STATES.find((s) => s.id === id) || STATES[0];
  S = fresh();
  S.id = st.id;
  st.run();
  render();
}
function step(d) { const i = STATES.findIndex((s) => s.id === S.id); location.hash = STATES[(Math.max(i, 0) + d + STATES.length) % STATES.length].id; }

/* ══ Interaction: navigation between states, menus, twisties ══ */
document.addEventListener('click', (e) => {
  if (e.target.closest('#mkr')) return;
  const g = e.target.closest('[data-go]');
  if (g && !g.disabled) { location.hash = g.dataset.go; return; }
  const a = e.target.closest('[data-act]');
  if (!a) { if (S.menu || S.smenu) { S.menu = S.smenu = null; render(); } return; }
  const id = a.dataset.id;
  if (a.dataset.act === 'menu') { S.menu = S.menu === id ? null : id; S.smenu = null; }
  if (a.dataset.act === 'smenu') { S.smenu = S.smenu === id ? null : id; S.menu = null; }
  if (a.dataset.act === 'twisty') S.collapsed.has(id) ? S.collapsed.delete(id) : S.collapsed.add(id);
  if (a.dataset.act === 'stw') S.scol.has(id) ? S.scol.delete(id) : S.scol.add(id);
  if (a.dataset.act === 'sopen') S.sopen.has(id) ? S.sopen.delete(id) : S.sopen.add(id);
  render();
});
document.addEventListener('change', (e) => { if (e.target.id === 'rv-tick') { S.tick = e.target.checked; render(); } });
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && (S.menu || S.smenu)) { S.menu = S.smenu = null; render(); return; }
  if (e.target.closest && e.target.closest('input')) return;
  if (e.key === ']') step(1);
  if (e.key === '[') step(-1);
});
addEventListener('resize', () => placeDrag());

/* ══ Mockup review tool (not part of the design) ══ */
let mkOpen = false;
function renderMk() {
  const i = STATES.findIndex((s) => s.id === S.id);
  const lbl = `<b>${i + 1}/${STATES.length}</b> ${esc(STATES[i].label)}`;
  let panel = '';
  if (mkOpen) {
    const groups = [...new Set(STATES.map((s) => s.g))];
    panel = `<div class="mkr-panel" role="region" aria-label="Mockup states">${groups.map((g) => `<h4>${g}</h4>${STATES.map((s, k) => (s.g === g ? `<a class="mkr-s${s.id === S.id ? ' on' : ''}" href="#${s.id}"><span class="n">${k + 1}</span><span>${esc(s.label)}</span></a>` : '')).join('')}`).join('')}
    <h4>Try it</h4><ul><li>Hover a folder or group row for Rename… and ···; the menus, New folder, Add folder, Review…, Back and Apply step between the drawn states. [ and ] step through them.</li><li>Twisties open and close, on the Arrange screen and in the sidebar.</li><li>Dragging isn’t live here (the arrange mockup has it): the five drag states are drawn.</li><li>Under 1,024 wide the editor shows its too-narrow note, as shipped.</li></ul>
    <h4>Rules a static file can’t show</h4><ul><li>Folders sit at any level (Decision 3): Careers, inside the About Us group, is one.</li><li>A page dragged into a folder at another level is two things: its address change is listed with the tick in the review.</li><li>Take out of the addresses is offered on a group only, never on a page with pages under it.</li><li>An existing folder emptied by an Apply goes, with the group’s line as is: “What We Do goes: no pages left in it”.</li><li>New page in a folder with Site Settings held by someone else: made at once, filed when Site Settings is free (as hand-order’s waiting entry), with no line.</li><li>Find matches folder names, and opens a folder that holds a match.</li><li>No side rails: folders, filed rows and drop targets are icons, words, washes and full rings.</li></ul></div>`;
  }
  $('#mkr').innerHTML = `<div class="mkr-tab"><button type="button" class="mkr-b" data-mk="prev" aria-label="Previous state">◀</button><span class="lbl">${lbl}</span><button type="button" class="mkr-b" data-mk="next" aria-label="Next state">▶</button><button type="button" class="mkr-b${mkOpen ? ' on' : ''}" data-mk="toggle">States</button></div>${panel}`;
}
$('#mkr').addEventListener('click', (e) => {
  const b = e.target.closest('[data-mk]');
  if (!b) return;
  if (b.dataset.mk === 'toggle') { mkOpen = !mkOpen; renderMk(); }
  if (b.dataset.mk === 'next') step(1);
  if (b.dataset.mk === 'prev') step(-1);
});
$('#nw-logo').innerHTML = LOGO;
addEventListener('hashchange', () => applyState(location.hash.slice(1)));
applyState(location.hash.slice(1) || 'open');
</script>
</body>
</html>
